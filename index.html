<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Catch-Up</title>
<style>
:root{
  --ink:#1c1a16; --dim:#6e6a5e; --faint:#9b9585;
  --bg:#fbfaf6; --panel:#f2efe7; --rule:#e4e0d4; --spine:#d8d3c4;
  --link:#8a4416; --mark:#b8842c;
  --contested:#b8842c; --unverified:#c9c3b3; --verified:#4a7a58;
  --lane:74rem;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#ece8de; --dim:#98917f; --faint:#6a6456;
    --bg:#111110; --panel:#1a1916; --rule:#282621; --spine:#332f27;
    --link:#dc9b62; --mark:#c08a2e;
    --contested:#c08a2e; --unverified:#3b382f; --verified:#5f9b6e;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.6 ui-serif,Georgia,"Iowan Old Style",serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--link)}
code{font:.85em ui-monospace,Menlo,monospace}
.muted{color:var(--faint); font:.78rem/1.5 ui-sans-serif,system-ui}
.warn{padding:.55rem 1rem; text-align:center; background:var(--mark); color:#141310; font:.74rem/1.5 ui-sans-serif,system-ui; letter-spacing:.01em}
.warn b{font-weight:800; letter-spacing:.05em}

.rail{
  position:fixed; top:0; left:0; right:0; z-index:9; display:flex; gap:.7rem;
  align-items:baseline; justify-content:center; padding:.4rem 1rem;
  background:color-mix(in srgb,var(--bg) 90%,transparent); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rule);
  font:.71rem ui-sans-serif,system-ui; letter-spacing:.06em; text-transform:uppercase;
}
.rail span:first-child{font-weight:700}
.rail span:last-child{color:var(--faint); font-family:ui-monospace,Menlo,monospace; text-transform:none}

main{max-width:100%; overflow-x:hidden}
.open{max-width:36rem; margin:0 auto; padding:clamp(4rem,15vh,8rem) 1.25rem clamp(2rem,6vh,3.5rem)}
.open h1{margin:0; font-size:clamp(2.4rem,8vw,3.4rem); font-weight:600; letter-spacing:-.03em; line-height:1}
.open-lede{margin:1rem 0 0; color:var(--dim); font-size:1.02rem}

.chapter-head{max-width:36rem; margin:0 auto; padding:clamp(2rem,7vh,4rem) 1.25rem clamp(1.5rem,4vh,2.5rem); border-top:1px solid var(--rule)}
.chapter-span{margin:0 0 .5rem; font:.72rem ui-monospace,Menlo,monospace; color:var(--faint); letter-spacing:.06em}
.chapter-head h2{margin:0; font-size:clamp(1.7rem,5vw,2.3rem); font-weight:600; letter-spacing:-.02em}
.chapter-strap{margin:.5rem 0 0; font-size:1.05rem}
.chapter-intro{margin:1rem 0 0; color:var(--dim); font-size:.98rem}

/* ---- the spine ---- */
.moment{
  position:relative; max-width:var(--lane); margin:0 auto; padding:.4rem 1.25rem .4rem 9.5rem;
}
.moment::before{
  content:""; position:absolute; left:7.15rem; top:0; bottom:-.1rem;
  width:1px; background:var(--spine);
}
.moment-when{position:absolute; left:0; top:.35rem; width:6.6rem; text-align:right}
.moment-when .dot{
  position:absolute; right:-1.32rem; top:.42rem; width:9px; height:9px; border-radius:50%;
  background:var(--bg); border:2px solid var(--mark);
}
.moment-year{display:block; font:.78rem/1.4 ui-monospace,Menlo,monospace; color:var(--ink)}
.moment-note{display:block; margin-top:.15rem; font:.68rem ui-sans-serif,system-ui; color:var(--mark); letter-spacing:.03em}
.moment-note.muted-note{color:var(--faint)}

.moment-lane{display:flex; flex-wrap:wrap; gap:.75rem; padding-bottom:1.1rem}

/* ---- gaps: the empty stretches are the point ---- */
.gapyears{
  position:relative; max-width:var(--lane); margin:0 auto;
  padding:0 1.25rem 0 9.5rem; height:var(--gap-h,8vh);
  display:flex; align-items:center; gap:.7rem;
}
.gapyears::before{
  content:""; position:absolute; left:7.15rem; top:0; bottom:0; width:1px;
  background:repeating-linear-gradient(var(--spine) 0 3px,transparent 3px 8px);
}
.gapyears-line{flex:0 0 1.5rem; height:1px; background:var(--rule)}
.gapyears-line:last-child{flex:1 1 auto}
.gapyears-label{font:.72rem ui-sans-serif,system-ui; color:var(--faint); letter-spacing:.05em; white-space:nowrap}

/* ---- cards ---- */
.card{
  flex:1 1 17rem; max-width:23rem; background:var(--panel);
  border:1px solid var(--rule); border-left:2px solid var(--unverified); border-radius:4px;
}
.card.v-contested{border-left-color:var(--contested)}
.card.v-verified{border-left-color:var(--verified)}
.card-head{
  display:block; width:100%; text-align:left; background:none; border:0;
  padding:.7rem .85rem .8rem; cursor:pointer; color:inherit; font:inherit;
}
.card-head:hover h3{color:var(--link)}
.card-region{display:block; font:.64rem ui-sans-serif,system-ui; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.card h3{margin:.2rem 0 0; font-size:1.1rem; font-weight:600; line-height:1.25}
.card-change{margin:.25rem 0 0; font-size:.92rem; line-height:1.45}
.card-where{margin:.3rem 0 0; font:.74rem ui-sans-serif,system-ui; color:var(--faint)}
.card-body{padding:0 .85rem .9rem}
.card-title{margin:0 0 .5rem; font-size:.88rem; font-weight:600; color:var(--dim)}
.card-sig{margin:0 0 .7rem; font-size:.9rem; color:var(--dim); line-height:1.55}
.card-body details summary{cursor:pointer; font:.74rem ui-sans-serif,system-ui; color:var(--faint)}
.card-q{margin:.5rem 0 0; font-size:.85rem; color:var(--dim)}
.src{margin:.5rem 0 0; padding:0; list-style:none; font:.74rem/1.5 ui-sans-serif,system-ui}
.src li{border-left:2px solid var(--rule); padding-left:.55rem; margin:0 0 .45rem}
.src .muted{display:block; margin-top:.1rem; font-size:.72rem}

/* ---- absence ---- */
.absent{
  position:relative; max-width:var(--lane); margin:0 auto; padding:.6rem 1.25rem 1.4rem 9.5rem;
}
.absent::before{content:""; position:absolute; left:7.15rem; top:0; bottom:0; width:1px; background:repeating-linear-gradient(var(--spine) 0 3px,transparent 3px 8px)}
.absent h4{margin:0; font:700 .68rem ui-sans-serif,system-ui; letter-spacing:.1em; text-transform:uppercase; color:var(--mark)}
.absent p{margin:.35rem 0 0; font-size:.88rem; color:var(--faint); max-width:44rem}
.absent-list{margin:.5rem 0 0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:.25rem .4rem; font:.72rem ui-sans-serif,system-ui}
.absent-list li{padding:.1rem .45rem; border:1px dashed var(--rule); border-radius:99px; color:var(--faint)}

.chapter-close{max-width:36rem; margin:0 auto; padding:2rem 1.25rem 0; border-top:1px solid var(--rule)}
.chapter-close p{margin:0; font-size:1.02rem}
.end{max-width:36rem; margin:0 auto; padding:clamp(2.5rem,8vh,5rem) 1.25rem clamp(4rem,12vh,7rem)}
.end-lede{margin:0; font-size:1.1rem}
.end p+p{margin:.7rem 0 0; color:var(--dim); font-size:.92rem}
.empty{max-width:36rem; margin:3rem auto; padding:0 1.25rem; color:var(--dim)}

@media (max-width:56rem){
  .moment,.gapyears,.absent{padding-left:3.6rem}
  .moment::before,.gapyears::before,.absent::before{left:1.25rem}
  .moment-when{position:static; width:auto; text-align:left; margin-bottom:.4rem}
  .moment-when .dot{position:absolute; left:.86rem; right:auto; top:.55rem}
  .moment-note{display:inline; margin-left:.5rem}
  .card{max-width:none; flex:1 1 100%}
}

/* ---- world zones ------------------------------------------------------
   Three hues only. The data-viz validator fails any categorical palette past
   three on an all-pairs layout (4 hues: normal-vision ΔE 9.8 against a floor
   of 15), so 16 regions cannot each carry a colour a reader can tell apart.
   Colour marks the three landmasses that were out of contact; the region is
   carried by text and by grouping, never by colour alone.
   Validated: light #2a78d6,#eb6834,#1baf7a — all checks pass, --pairs all.
   Dark: #3987e5,#d95926,#199e70 — all checks pass, --pairs all.            */
:root{ --z-afro:#2a78d6; --z-amer:#eb6834; --z-ocea:#1baf7a; }
@media (prefers-color-scheme:dark){
  :root{ --z-afro:#3987e5; --z-amer:#d95926; --z-ocea:#199e70; }
}
.z-afro-eurasia{--zone:var(--z-afro)}
.z-americas{--zone:var(--z-amer)}
.z-oceania{--zone:var(--z-ocea)}

.zonekey{display:flex; flex-wrap:wrap; gap:.5rem .95rem; align-items:center; margin:1.1rem 0 0}
.zonetag{display:inline-flex; align-items:center; gap:.35rem; font:.74rem ui-sans-serif,system-ui; color:var(--dim)}
.zonetag .swatch{width:9px; height:9px; border-radius:2px; background:var(--zone)}
.zonekey-note{font:.72rem ui-sans-serif,system-ui; color:var(--faint); flex:1 1 100%}

/* area facet inside a moment */
.moment-lane{display:flex; flex-wrap:wrap; gap:1rem 1.1rem; padding-bottom:1.1rem; align-items:flex-start}
.area{flex:1 1 17rem; max-width:23rem; border-top:2px solid var(--zone); padding-top:.4rem}
.area-name{
  margin:0 0 .4rem; font:700 .64rem ui-sans-serif,system-ui;
  letter-spacing:.11em; text-transform:uppercase; color:var(--zone);
}
.area-cards{display:flex; flex-direction:column; gap:.5rem}
.area .card{flex:none; max-width:none}
.area .card-region{display:none}   /* the area heading already names it */

/* period bands */
.period{
  max-width:36rem; margin:2.2rem auto .6rem; padding:0 1.25rem;
}
.period h3{margin:0; font-size:1.3rem; font-weight:600; letter-spacing:-.01em}
.period-when{margin:.15rem 0 0; font:.72rem ui-monospace,Menlo,monospace; color:var(--faint); letter-spacing:.05em}
.period-note{margin:.45rem 0 0; font-size:.92rem; color:var(--dim)}
@media (max-width:56rem){ .period{padding-left:3.6rem} }

/* ---- threads: connective prose, sourced ---- */
.thread{
  max-width:36rem; margin:2rem auto; padding:1.3rem 1.5rem;
  background:var(--panel); border-radius:5px; border-left:3px solid var(--mark);
}
.thread-kicker{
  margin:0; font:700 .64rem ui-sans-serif,system-ui; letter-spacing:.14em;
  text-transform:uppercase; color:var(--mark);
}
.thread h3{margin:.25rem 0 .7rem; font-size:1.32rem; font-weight:600; letter-spacing:-.01em; line-height:1.2}
.thread p{margin:0 0 .8rem; font-size:1rem; line-height:1.65}
.thread p:last-of-type{margin-bottom:0}
.thread-src{margin-top:.9rem}
.thread-src summary{cursor:pointer; font:.76rem ui-sans-serif,system-ui; color:var(--faint)}
@media (max-width:56rem){ .thread{margin-left:3.6rem; margin-right:1.25rem} }
.period-also{margin:.4rem 0 0; font:.82rem/1.5 ui-sans-serif,system-ui; color:var(--faint); max-width:34rem}
.period-also b{color:var(--mark); font-weight:650}

/* ---- the history layer: a second, separately filtered layer (the-catch-up) ---- */
.layer-toggle{margin:1.2rem 0 0; display:flex; flex-wrap:wrap; align-items:center; gap:.6rem}
.layer-btn{
  font:600 .78rem/1 ui-sans-serif,system-ui; letter-spacing:.02em; padding:.55rem .85rem;
  border:1px solid var(--mark); border-radius:999px; background:transparent; color:var(--ink); cursor:pointer;
}
.layer-btn[aria-pressed="true"]{background:var(--mark); color:#141310}
.layer-btn:focus-visible{outline:2px solid var(--link); outline-offset:2px}
.layer-note{font:.74rem/1.5 ui-sans-serif,system-ui; color:var(--faint); flex:1 1 16rem}
.card.layer-history{border-style:dashed}
.card-layer{display:block; font:700 .62rem/1.4 ui-sans-serif,system-ui; letter-spacing:.08em;
  text-transform:uppercase; color:var(--mark)}
.era-empty{max-width:36rem; margin:0 auto 2rem}

</style>
</head>

debt_total": 73, "history_floor_total": 21, "history_debt_total": 21}, "trunk": {"label": "The Trunk", "title": "The Trunk", "strap": "Before anything forks, everyone is solving the same problems.", "intro": "For almost all of the human story there is no record, because there was no way to make one. Then, over a few thousand years, people in scattered places begin to settle, to farm, to fire clay, to count what they have stored, and eventually to fix a thought outside a human head. Almost none of it is inherited from anywhere else: these are separate groups reaching similar answers because they are standing in front of similar problems.", "closing": "By the end of this stretch a person can write down something they were not present for, calculate with it, and hand it to someone who will read it after they are dead. Everything that follows depends on those three things.", "span": {"start": -20000, "end": -1000}, "periods": [{"id": "pre-farming", "name": "Before farming", "start": -20000, "end": -9701, "note": "Foragers everywhere. Fired clay and the first domesticated animal arrive before anyone plants anything."}, {"id": "farming", "name": "Farming begins", "start": -9700, "end": -4501, "also": "the Neolithic", "also_scope": "a European term, but the shift it names happened separately on four continents", "note": "Plants and animals taken in hand, independently, in a dozen places. Villages, then towns."}, {"id": "metal-and-cities", "name": "Metal and cities", "start": -4500, "end": -3301, "also": "the Copper Age, or Chalcolithic", "also_scope": "in Afro-Eurasia only", "note": "Copper worked in the Old World; irrigation makes floodplains carry towns. The Americas and the Pacific are doing neither, and are not behind."}, {"id": "writing-and-bronze", "name": "Written records", "start": -3300, "end": -1000, "also": "the Bronze Age", "also_scope": "in Afro-Eurasia only. Caral, the Pacific voyages and the eastern North American crops belong to this stretch of time and to no bronze age at all", "note": "Records start surviving, so for the first time we hear from people rather than only about them."}], "threads": [{"id": "why-rivers", "at": -4000, "title": "Why the big ones are on rivers", "body": "Look at where the first cities are and they sit on floodplains, and it is not because water is scarce elsewhere. A river gives two things at once that nothing else gives together. It gives water you can steer: a flood you can cut a channel into is a flood you can spend, and the surplus that fed Sumer is hard to explain at all before large-scale irrigation, with the coastal tides doing the work first and the canal networks of the city-states following. And it gives a road, because a loaded boat going downstream costs almost nothing to move.\n\nThe catch is that this explains cities, not farming. Farming starts in places with no great river at all. It starts in the Zagros foothills, where people tended wild stands for two thousand years before anything was domesticated. It starts in a highland swamp in New Guinea, where the technique is drainage rather than irrigation - the problem there is too much water, not too little. It starts around a lake on the altiplano at almost four thousand metres. Even in the Indus, the settlements move continuously, tracking a river network that would not hold still.\n\nAn earlier draft of this thread also credited the river with soil that renews itself and with cheap overland-beating transport. Neither claim had a source under it and the first runs against the standard account of salinisation in southern Mesopotamia, so both are struck.\n\nSo the rule is narrower than it looks. Rivers did not teach anyone to farm. Rivers are what let farming carry a city.", "sources": [{"citation": "Giosan, L., & Goodman, R. (2025). Morphodynamic Foundations of Sumer. PLoS One, 20, e0329084. DOI 10.1371/journal.pone.0329084.", "url": "https://doi.org/10.1371/journal.pone.0329084", "accessed": "2026-08-24", "supports": "the difficulty of explaining Sumerian agricultural surplus before large-scale irrigation; tidal irrigation as a jump-start; the later fluvial canal networks of the Early Dynastic city-states"}, {"citation": "Orengo, H. A., et al. (2020). Automated detection of archaeological mounds... Proceedings of the National Academy of Sciences, 117, 18240-18250. DOI 10.1073/pnas.2005583117.", "url": "https://doi.org/10.1073/pnas.2005583117", "accessed": "2026-08-24", "supports": "continuous shifts in Indus settlement location read as responses to a dynamic and changing hydrological network"}, {"citation": "Riehl, S., Zeidi, M., & Conard, N. J. (2013). Emergence of agriculture in the foothills of the Zagros Mountains of Iran. Science, 341, 65-67. DOI 10.1126/science.1236743.", "url": "https://doi.org/10.1126/science.1236743", "accessed": "2026-08-24", "supports": "a 2,200-year sequence of cultivating wild plants at Chogha Golan in the Zagros foothills, away from any great river"}, {"citation": "Denham, T. P., et al. (2003). Origins of agriculture at Kuk Swamp in the Highlands of New Guinea. Science, 301, 189-193. DOI 10.1126/science.1085255.", "url": "https://doi.org/10.1126/science.1085255", "accessed": "2026-08-24", "supports": "independent origins of agriculture in a highland wetland where the technique is drainage rather than irrigation"}, {"citation": "Flores-Blanco, L., et al. (2025). Altiplano agricultural origins was a process of economic resilience, not hardship... PLOS ONE, 20, e0325626. DOI 10.1371/journal.pone.0325626.", "url": "https://doi.org/10.1371/journal.pone.0325626", "accessed": "2026-08-24", "supports": "agricultural origins in the high-altitude Titicaca Basin, away from any floodplain"}]}], "order": 1, "zones": {"afro-eurasia": ["mesopotamia", "egypt-nile", "levant-anatolia", "mediterranean", "europe-west", "europe-north-east", "persia-central-asia", "arabia-islamicate", "south-asia", "east-asia", "southeast-asia", "africa-sub-saharan"], "americas": ["americas-meso", "americas-andean", "americas-north"], "oceania": ["oceania"]}, "entries": 64, "history_entries": 0, "floor_total": 57, "debt": [{"region": "oceania", "have": 2, "floor": 3}], "debt_total": 1, "history_floor_total": 12, "history_debt_total": 12}}, "entries": [{"id": "pottery-before-farming", "title": "Hunter-gatherers fire clay into vessels, ten thousand years before farming", "type": "invention", "layer": "knowledge", "date": {"start": -18000, "end": -17000, "precision": "range"}, "location": {"name": "Xianrendong Cave, Jiangxi Province, southern China", "lat": 29.2, "lng": 117.1, "region": "east-asia"}, "categories": ["technology", "materials"], "question": "How do you carry water, or cook something that did not arrive inside a shell or a skull?", "answer": "Shape clay and fire it. The heat is irreversible, so the shape is permanent, and the shape can be anything.", "significance": "The oldest known containers with no natural original were made by people who had not yet farmed anything. The archaeological contexts of the earliest sherds date to 20,000 to 19,000 years ago, two to three thousand years older than any other pottery found anywhere, and the occupations show mobile foragers hunting and gathering through the Late Glacial Maximum. Pottery is normally recited as one item in the Neolithic package, and it precedes the emergence of agriculture by ten millennia or more.", "sources": [{"citation": "Wu, X., Zhang, C., Goldberg, P., Cohen, D., Pan, Y., Arpin, T., & Bar-Yosef, O. (2012). Early pottery at 20,000 years ago in Xianrendong Cave, China. Science, 336(6089), 1696-1700. DOI 10.1126/science.1218643.", "url": "https://doi.org/10.1126/science.1218643", "accessed": "2026-08-24", "supports": "the 20,000-19,000 cal BP radiocarbon ages of the contexts of the earliest sherds; their being 2,000-3,000 years older than other pottery in East Asia and elsewhere; production by mobile foragers hunting and gathering during the Late Glacial Maximum; possible use as cooking devices; pottery first made and used 10 millennia or more before the emergence of agriculture", "kind": "scholarly"}], "verification": "unverified", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "label": "Pottery", "change": "Fired clay containers, ten thousand years before anyone farmed.", "era": "trunk"}, {"id": "natufian-sedentism", "label": "Staying put", "change": "Villages, storage and burial, built by people still hunting for a living.", "title": "People settle down before they farm", "type": "invention", "layer": "knowledge", "date": {"start": -13000, "end": -9500, "precision": "range"}, "location": {"name": "The Levant; Ain Mallaha and related sites", "lat": 33.1, "lng": 35.6, "region": "levant-anatolia"}, "categories": ["society", "technology"], "question": "Can a group stay in one place all year without planting anything?", "answer": "Where the wild food is rich enough, yes — with stone houses, food stores and formal graves, while still hunting gazelle and cutting wild cereal.", "significance": "Storage is the part that changes everything, because a store is a claim on the future that can be owned, counted, inherited and stolen, and here it exists before there is a harvest to put in it. The Natufians are treated as the first sedentary communities of south-west Asia, and the symbolic life that goes with settling shows up in their personal ornaments as much as in their architecture. This inverts the order the transition is usually told in: settlement is normally presented as what farming made possible, and here farming appears among people who had already been staying put for millennia.", "sources": [{"citation": "Davin, L., Sindel, M., Yeshurun, R., Weinstein-Evron, M., Kaufman, D., Shklyar, B., Grosman, L., Belfer-Cohen, A., Khalaily, H., & Valla, F. R. (2026). Modeling identities among the first-sedentary communities: emergence of clay personal ornaments in Epipaleolithic Southwest Asia. Science Advances, 12(12), eaea2158. DOI 10.1126/sciadv.aea2158.", "url": "https://doi.org/10.1126/sciadv.aea2158", "accessed": "2026-08-25", "supports": "the Natufians as first-sedentary communities of south-west Asia; 142 clay personal ornaments from five Natufian sites; newly emerging symbolic expression at the dawn of sedentism shaping the Neolithic transition", "kind": "scholarly"}, {"citation": "\"Natufian culture\", Wikipedia. An encyclopedia entry, cited for dates and the material specifics.", "url": "https://en.wikipedia.org/wiki/Natufian_culture", "accessed": "2026-08-25", "supports": "dates of 15,000-11,500 BP and the Levantine range; stone architecture at Ain Mallaha; the first evidence of food storage; formal burial with grave goods; exploitation of wild cereals and gazelle hunting; sickle-gloss indicating cereal cutting", "kind": "tertiary"}], "verification": "unverified", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "rice-domestication-yangtze", "label": "Rice", "change": "The grain that feeds more people than any other, domesticated once.", "title": "Rice is brought under cultivation in the Yangtze basin", "type": "invention", "layer": "knowledge", "date": {"start": -11500, "end": -6200, "precision": "disputed"}, "location": {"name": "The Yangtze River basin, southern China", "lat": 30.5, "lng": 114.3, "region": "east-asia"}, "categories": ["agriculture", "biology"], "question": "Can a wetland grass be made to feed a dense population, year after year, on the same ground?", "answer": "Yes — and on the genetic evidence it was done once, not repeatedly, whatever the divergence between indica and japonica suggests.", "significance": "Rice supports higher population densities than any other grain, which makes it the substrate for most of what East Asia does later. Whether it was domesticated once or several times was the live question, since indica and japonica are strongly differentiated; resequencing 630 gene fragments and identifying twenty selective sweeps gave demographic modelling and Bayesian phylogenetics that both favour a single origin. The molecular clock spans 8,200 to 13,500 years ago depending which calibration is used, which is why the date here is a range rather than a claim.", "sources": [{"citation": "Molina, J., Sikora, M., Garud, N., Flowers, J. M., Rubinstein, S., Reynolds, A., et al. (2011). Molecular evidence for a single evolutionary origin of domesticated rice. Proceedings of the National Academy of Sciences, 108, 8351-8356. DOI 10.1073/pnas.1104686108.", "url": "https://doi.org/10.1073/pnas.1104686108", "accessed": "2026-08-26", "supports": "the single-origin versus multiple-domestication debate for indica and japonica; resequencing of 630 gene fragments and 20 putative selective sweeps; demographic modelling and Bayesian phylogenetics supporting a single origin; a molecular-clock date of c. 8,200-13,500 years ago; consistency with Yangtze archaeology", "kind": "scholarly"}], "verification": "contested", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "chogha-golan-cultivation", "title": "Two thousand years of farming wild plants before anything is domesticated", "type": "discovery", "layer": "knowledge", "date": {"start": -10050, "end": -7850, "precision": "range"}, "location": {"name": "Chogha Golan, Zagros foothills, Ilam Province, western Iran", "lat": 33.0, "lng": 46.4, "region": "persia-central-asia"}, "categories": ["agriculture", "biology"], "question": "These stands feed us where they grow. Can they be made to grow where we want them?", "answer": "Yes, and for roughly two thousand years that was done with plants that were still wild, before any domesticated-type cereal appears in the record.", "significance": "Cultivation ran ahead of domestication by two thousand years, which removes any moment at which agriculture was invented. Across a 2,200-year sequence the inhabitants tended wild barley and the wild progenitors of lentil and pea, with wild wheat rising from under a tenth of the plant species to over a fifth in the final three centuries, before domesticated-type emmer appears around 9,800 years ago. It is also the earliest record of long-term plant management in Iran, in an argument about cereal origins that had long been open.", "sources": [{"citation": "Riehl, S., Zeidi, M., & Conard, N. J. (2013). Emergence of agriculture in the foothills of the Zagros Mountains of Iran. Science, 341(6141), 65-67. DOI 10.1126/science.1236743.", "url": "https://doi.org/10.1126/science.1236743", "accessed": "2026-08-24", "supports": "the long-debated role of Iran as a centre of origin for domesticated cereals; the 2,200-year sequence at aceramic Neolithic Chogha Golan; cultivation of wild barley and of wild progenitors including lentil and pea; wild wheat rising from under 10 percent to more than 20 percent of total plant species over the last 300 years of the sequence; domesticated-type emmer appearing around 9,800 cal BP; the site as the earliest record of long-term plant management in Iran", "kind": "scholarly"}], "verification": "unverified", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "label": "Farming wild plants", "change": "Two thousand years of cultivation before anything was domesticated.", "era": "trunk"}, {"id": "gobekli-tepe", "label": "Gobekli Tepe", "change": "Megaliths raised by people who had not yet taken up farming.", "title": "Monumental building arrives before agriculture does", "type": "invention", "layer": "knowledge", "date": {"start": -9500, "end": -8000, "precision": "range"}, "location": {"name": "Gobekli Tepe, near Sanliurfa, south-eastern Anatolia", "lat": 37.22, "lng": 38.92, "region": "levant-anatolia"}, "categories": ["architecture", "society"], "question": "How much can people build together before they have farms, surplus, or anyone in charge?", "answer": "Enough to quarry, carve and raise the oldest known megaliths, and to keep doing it for fifteen hundred years.", "significance": "The excavators' claim is that this site pushes the origins of monumentality back beyond the emergence of agriculture, which removes surplus from the list of things a society must have before it builds. Their reading is that hunter-gatherers converging on the hilltop produced social and ideological cohesion through carving, dancing and feasting, very probably including beer made from fermented wild crops — organisation held together by gathering rather than by stores. Subsequent excavation has found domestic structures, cisterns and heavy cereal processing, which points toward people living there rather than assembling and dispersing, and that reading is not settled.", "sources": [{"citation": "Dietrich, O., Heun, M., Notroff, J., Schmidt, K., & Zarnkow, M. (2012). The role of cult and feasting in the emergence of Neolithic communities. New evidence from Gobekli Tepe, south-eastern Turkey. Antiquity, 86(333), 674-695. DOI 10.1017/S0003598X00047840.", "url": "https://doi.org/10.1017/S0003598X00047840", "accessed": "2026-08-25", "supports": "the claim that the site pushes the origins of monumentality back beyond the emergence of agriculture; hunter-gatherers congregating and creating social and ideological cohesion through carved pillars, dancing and feasting; the excavators' proposal of beer from fermented wild crops", "kind": "scholarly"}, {"citation": "\"Gobekli Tepe\", Wikipedia. An encyclopedia entry, cited for dates, scale and the later revision of the excavators' reading.", "url": "https://en.wikipedia.org/wiki/G%C3%B6bekli_Tepe", "accessed": "2026-08-25", "supports": "radiocarbon dates of 9500-8000 BCE across at least 1,500 years; T-shaped pillars as the oldest known megaliths; later findings of domestic structures, water cisterns and extensive cereal processing that contrast with the earlier sanctuary-for-nomads interpretation", "kind": "tertiary"}], "verification": "contested", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "manufactured", "era": "trunk"}, {"id": "african-ceramics", "label": "African pottery", "change": "Pottery invented again in Africa, by fishers and foragers, not farmers.", "title": "Africa arrives at fired pottery on its own", "type": "invention", "layer": "knowledge", "date": {"start": -9050, "end": -8050, "precision": "range"}, "location": {"name": "The early Holocene Sahara and Sahel", "lat": 21.0, "lng": 10.0, "region": "africa-sub-saharan"}, "categories": ["technology", "materials"], "question": "How do you cook and store what the wetter Sahara has suddenly made abundant?", "answer": "Fire clay into vessels. Bayesian analysis of radiocarbon dates points to more than one African origin, in the eleventh to tenth millennium before present.", "significance": "Pottery is not one invention that travelled; it is at least three, and this is the African one. The dates cluster in the African Humid Period among hunter-gatherer-fisher groups adapting to a suddenly more productive landscape, which repeats the East Asian pattern exactly: containers before farming, made by people with no crops. That two continents reach the same answer from the same pressure, thousands of kilometres and thousands of years apart, is the strongest available argument that the technology follows the problem rather than the culture.", "sources": [{"citation": "Rotunno, R., & Crema, E. R. (2025). Bayesian analyses of radiocarbon dates suggest multiple origins of ceramic technology in Early Holocene Africa. Nature Communications, 16, 8819. DOI 10.1038/s41467-025-63887-0.", "url": "https://doi.org/10.1038/s41467-025-63887-0", "accessed": "2026-08-26", "supports": "ceramic technology emerging between the 11th and 10th millennium cal BP during the African Humid Period; multiple origins rather than one; adoption among hunter-gatherer-fisher groups adapting to changing and increased ecological productivity", "kind": "scholarly"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "millet-domestication-yellow-river", "title": "Common millet becomes the first dry-farming crop of East Asia", "type": "invention", "layer": "knowledge", "date": {"start": -8350, "end": -6750, "precision": "range"}, "location": {"name": "Cishan, Hebei Province, northern China", "lat": 36.6, "lng": 114.1, "region": "east-asia"}, "categories": ["agriculture", "biology"], "question": "What will grow where the rain is thin and the season is short?", "answer": "Common millet, Panicum miliaceum, held in storage pits at Cishan from about 10,300 calibrated years before the present, with foxtail millet appearing only later.", "significance": "Northern China took up farming on its own crop and at its own time, on this evidence earlier than the rice south. Husk phytoliths and biomolecular components from storage pits at Cishan identify common millet specifically, between about 10,300 and 8,700 years ago, with foxtail millet appearing only afterwards, which settles which of the two came first. Drought resistance is the reason, and it is what made the loess country farmable at all.", "sources": [{"citation": "Lu, H., Zhang, J., Liu, K.-B., Wu, N., Li, Y., Zhou, K., Ye, M., Zhang, T., Zhang, H., Yang, X., Shen, L., Xu, D., & Li, Q. (2009). Earliest domestication of common millet (Panicum miliaceum) in East Asia extended to 10,000 years ago. Proceedings of the National Academy of Sciences, 106(18), 7367-7372. DOI 10.1073/pnas.0900158106.", "url": "https://doi.org/10.1073/pnas.0900158106", "accessed": "2026-08-24", "supports": "husk phytoliths and biomolecular components identifiable solely as common millet from newly excavated storage pits at Cishan, dated c. 10,300-8,700 cal BP; foxtail millet appearing in small quantity only after c. 8,700 cal BP; the previously unresolved question of which millet was domesticated first; common millet as the earliest dry farming crop in East Asia, attributed to its drought resistance", "kind": "scholarly"}], "verification": "contested", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "label": "Millet", "change": "The crop that made dry northern China farmable.", "era": "trunk"}, {"id": "kuk-swamp-agriculture", "title": "Agriculture is invented again, independently, in the New Guinea highlands", "type": "invention", "layer": "knowledge", "date": {"start": -8270, "end": -2030, "precision": "range"}, "location": {"name": "Kuk Swamp, Wahgi valley, Western Highlands, Papua New Guinea", "lat": -5.78, "lng": 144.33, "region": "oceania"}, "categories": ["agriculture", "engineering"], "question": "This ground holds water and will not hold a crop. Can it be drained?", "answer": "Yes, and in three stages across six thousand years: cultivation on the wetland margin, then mounding, then ditching.", "significance": "Agriculture arose independently in New Guinea, on tubers and trees rather than seeds, by at least 6,950 years ago. The ground records three stages: cultivation on the wetland margin at 10,220 to 9,910 years ago, mounded cultivation by 6,950 to 6,440, and ditched cultivation by 4,350 to 3,980, with taro used early and bananas grown in quantity by the middle stage. The primary technique is drainage, which is engineering applied to ground rather than selection applied to a plant.", "sources": [{"citation": "Denham, T. P., Haberle, S. G., Lentfer, C., Fullagar, R., Field, J., Therin, M., Porch, N., & Winsborough, B. (2003). Origins of agriculture at Kuk Swamp in the Highlands of New Guinea. Science, 301(5630), 189-193. DOI 10.1126/science.1085255.", "url": "https://doi.org/10.1126/science.1085255", "accessed": "2026-08-24", "supports": "agriculture arising independently in New Guinea by at least 6,950-6,440 cal BP; phase 1 plant exploitation and some cultivation on the wetland margin at 10,220-9,910 cal BP; phase 2 mounding cultivation by 6,950-6,440 cal BP; phase 3 ditched cultivation by 4,350-3,980 cal BP; early Holocene rainforest clearance and modification to grassland at 6,950-6,440 cal BP; taro utilised in the early Holocene and bananas intensively cultivated by 6,950-6,440 cal BP", "kind": "scholarly"}], "verification": "unverified", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "label": "Swamp drainage", "change": "Farming invented again, on its own, in the New Guinea highlands.", "era": "trunk"}, {"id": "logboat", "label": "The dugout", "change": "A whole tree hollowed out, and water becomes a road instead of a wall.", "title": "A hollowed log carries people across water ten thousand years ago", "type": "invention", "layer": "knowledge", "date": {"start": -8040, "end": -7510, "precision": "range"}, "location": {"name": "Pesse, in the present-day Netherlands", "lat": 52.8, "lng": 6.5, "region": "europe-west"}, "categories": ["technology", "transport"], "question": "The fish and the far bank are both over there. How do we get to them?", "answer": "Burn and scrape out the inside of a log until it floats a person. No joints, no planks, nothing to leak.", "significance": "A dugout turns every lake, river and marsh from a barrier into a route, and it needs no carpentry at all in the sense of joining — the hull is one piece, which is why it survives and why it works. The method is fire and patience: controlled burning to char the inside, an adze to lift the charcoal away, repeated, and on better boats the sides steamed until they will bend outward into a flatter hull. The same answer turns up on three continents within a couple of thousand years, though nothing in the source settles whether they are separate inventions — the Pesse canoe in the Netherlands at 8040-7510 BCE, the Dufuna canoe in Nigeria at around 8,000 years old, and one at Kuahuqiao in Zhejiang of comparable age.", "sources": [{"citation": "\"Logboat\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/Logboat", "accessed": "2026-09-21", "supports": "the Pesse canoe as the world's oldest known dugout, carbon dated 8040-7510 BCE in the Netherlands; the Dufuna canoe of Nigeria at about 8,000 years old, the oldest boat found in Africa; an 8,000-year-old dugout at Kuahuqiao, Zhejiang, the earliest found in Asia; hollowing by controlled fire with the burnt wood removed by adze, and the alternative of parallel notches split out; steaming the sides to bend them into a flatter hull; dugouts as the oldest boat type found archaeologically", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "clay-token-accounting", "title": "Counting is fixed in clay before it is written: tokens and the sealed bulla", "type": "invention", "layer": "knowledge", "date": {"start": -8000, "end": -3500, "precision": "disputed"}, "location": {"name": "The Near East, including southern Mesopotamia", "lat": 31.32, "lng": 45.64, "region": "mesopotamia"}, "branch": "trunk", "categories": ["mathematics", "administration"], "question": "How can a quantity of goods be held in a form that neither party to the transaction can quietly revise afterwards?", "question_status": "reconstructed", "answer": "Shaped clay counters, one for each unit of a commodity, later sealed inside a hollow clay envelope whose outer surface was impressed with the same marks.", "significance": "A count could be fixed in a form neither party could quietly revise. The sealed clay envelope is the object that matters: checking it meant breaking it, so the count was pressed onto the outside as well, and once the outside sufficed the counters inside were redundant. Whether that is the actual line of descent to writing is disputed, and the objections run to sampling, classification, and weak correspondence between tokens and the earliest signs.", "links": {"builds_on": [], "leads_to": ["proto-cuneiform-accounting"]}, "sources": [{"citation": "\"Bulla (seal)\", Wikipedia. An encyclopedia entry, not a substitute for Schmandt-Besserat's own publications.", "url": "https://en.wikipedia.org/wiki/Bulla_(seal)", "accessed": "2026-08-24", "supports": "token dates, use for agricultural record-keeping, the bulla and its impressed exterior, the transition to impressed marks on tablets", "kind": "tertiary"}, {"citation": "\"Denise Schmandt-Besserat\", Wikipedia. An encyclopedia entry, cited for the record of published criticism it collects.", "url": "https://en.wikipedia.org/wiki/Denise_Schmandt-Besserat", "accessed": "2026-08-24", "supports": "Englund 1998 on consensus; the sampling, classification, correspondence and alternative-use objections; Chrisomalis 2005/2009; Overmann 2018/2021", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "label": "Clay tokens", "change": "A count neither side could quietly change afterwards.", "era": "trunk"}, {"id": "catalhoyuk", "title": "A Neolithic town rearranges who counts as a household, and never produces a ruler", "type": "discovery", "layer": "knowledge", "date": {"start": -7100, "end": -5950, "precision": "range"}, "location": {"name": "Catalhoyuk East Mound, Konya Plain, central Anatolia", "lat": 37.67, "lng": 32.83, "region": "levant-anatolia"}, "categories": ["society"], "question": "Who is buried under this floor, and what makes them belong to this house?", "answer": "Kin, at first. Later, people with no genetic relation to each other, though they ate the same food and lay under the same floor.", "significance": "A settlement could rearrange who counted as a household, across centuries, without producing a ruling class. Reading 131 palaeogenomes against the burials, the people under one building were frequently close kin early and frequently unrelated later while still sharing diets, with within-building ties maternal throughout and girls who died young receiving grave goods more often than boys. Gini analysis across buildings and through time finds no single direction of travel for inequality, and nothing institutional or lasting ever forms.", "sources": [{"citation": "Yuncu, E., Dogu, A. K., Kaptan, D., et al. (2025). Female lineages and changing kinship patterns in Neolithic Catalhoyuk. Science, 388(6754), eadr2915. DOI 10.1126/science.adr2915.", "url": "https://doi.org/10.1126/science.adr2915", "accessed": "2026-08-24", "supports": "the East Mound dated 7100-5950 BCE; 131 palaeogenomes combined with bioarchaeological and archaeological data; close genetic relatives co-buried in early phases and genetically unrelated individuals co-buried later despite similar diets; predominantly maternal within-building genetic connections in all periods; no indication of sex-biased mobility into the settlement; higher frequency of grave gifts to female subadults", "kind": "scholarly"}, {"citation": "Twiss, K. C., Bogaard, A., Haddow, S., Milella, M., Taylor, J. S., Veropoulidou, R., Kay, K., Knusel, C. J., Tsoraki, C., Vasic, M., Pearson, J., Busacca, G., Mazzucato, C., & Pochron, S. (2024). “But some were more equal than others:” Exploring inequality at Neolithic Catalhoyuk. PLoS One, 19(9), e0307067. DOI 10.1371/journal.pone.0307067.", "url": "https://doi.org/10.1371/journal.pone.0307067", "accessed": "2026-08-24", "supports": "Gini-based assessment of inequality across contemporaneous buildings, across buildings that did or did not burn at abandonment, and through time; the finding of no unified trajectory of inequality through time; broadly similar access to staple foods but not to goods less directly related to survival; elevated income inequality during the middle portion of the occupation, plausibly deliberately tamped down; no evidence for institutionalised or lasting economic or social inequality", "kind": "scholarly"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "manufactured", "label": "Catalhoyuk", "change": "Hundreds live packed together and never produce a ruler.", "era": "trunk"}, {"id": "maize-domestication", "title": "Teosinte is rebuilt into maize in southern Mexico, and the rebuilding does not stop there", "type": "invention", "layer": "knowledge", "date": {"start": -7000, "end": -7000, "precision": "circa"}, "location": {"name": "Southern Mexico; the oldest surviving maize types are of the Mexican highlands", "lat": 18.3, "lng": -99.5, "region": "americas-meso"}, "categories": ["agriculture", "biology"], "question": "Can this grass, which gives a handful of seeds no one can easily get at, be made worth planting?", "answer": "Yes. All maize traces to one domestication in southern Mexico about nine thousand years ago - though the plant that left Mexico was not yet finished.", "significance": "All maize descends from a single domestication in southern Mexico about nine thousand years ago, against the repeated-origins reading its landrace diversity had suggested. Genotyping 264 plants at 99 microsatellites places the oldest surviving types in the Mexican highlands, spreading from there along two major paths. Later work complicates how finished that origin was: the population that left Mexico lost contact with wild teosinte before the domesticated traits were fixed, and went on changing in South America.", "sources": [{"citation": "Matsuoka, Y., Vigouroux, Y., Goodman, M. M., Sanchez G., J., Buckler, E., & Doebley, J. (2002). A single domestication for maize shown by multilocus microsatellite genotyping. Proceedings of the National Academy of Sciences, 99(9), 6080-6084. DOI 10.1073/pnas.052125199.", "url": "https://doi.org/10.1073/pnas.052125199", "accessed": "2026-08-24", "supports": "the diversity of pre-Columbian maize landraces and the multiple-origins hypothesis proposed to explain it; 264 plants genotyped at 99 microsatellites; a single domestication in southern Mexico about 9,000 years ago; the oldest surviving types being those of the Mexican highlands; spread along two major paths; consistency with an archaeologically based model", "kind": "scholarly"}, {"citation": "Kistler, L., Maezumi, S. Y., Gregorio de Souza, J., et al. (2018). Multiproxy evidence highlights a complex evolutionary legacy of maize in South America. Science, 362(6420), 1309-1313. DOI 10.1126/science.aav0207.", "url": "https://doi.org/10.1126/science.aav0207", "accessed": "2026-08-24", "supports": "maize traversing Central America by c. 7,500 yr BP and reaching South America by c. 6,500 yr BP; the ancestral South American population leaving the Mexican domestication centre and becoming isolated from the wild teosinte gene pool before domesticated traits were fixed; deeply structured lineages evolving from that partially domesticated progenitor; the south-western Amazon as a secondary improvement centre; multiple waves of human-mediated dispersal", "kind": "scholarly"}], "verification": "contested", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "label": "Maize", "change": "A near-useless grass rebuilt into the staple of the Americas.", "era": "trunk"}, {"id": "cotton-domestication", "label": "Cotton", "change": "A crop grown for fibre, not for food, and worn instead of eaten.", "title": "South Asia farms a plant nobody can eat", "type": "invention", "layer": "knowledge", "date": {"start": -6000, "end": -3000, "precision": "range"}, "location": {"name": "South Asia and the Indus region", "lat": 27.3, "lng": 68.3, "region": "south-asia"}, "categories": ["agriculture", "biology", "technology"], "question": "What do you wear, once there are more of you than there are animals to skin?", "answer": "A plant. Cotton is grown and spun for its fibre, and cultivation of Gossypium arboreum spreads across South Asia from the mid-fifth millennium before present.", "significance": "Nearly every other early domesticate is grown to be eaten or worked; cotton is grown to be worn, which makes clothing a crop and puts textiles on the same agricultural footing as food. The sequence is the striking part: the fibre was in use as textile roughly three thousand years before the plant's cultivation spread widely, so people were working wild cotton long before they farmed it. The two Old World species take different paths, G. arboreum through South Asia and G. herbaceum later through north-east Africa, with wet climate phases including the African Humid Period proposed as what made the latter possible.", "sources": [{"citation": "Viot, C. R. (2026). Contrasted dissemination patterns of Old-World cottons Gossypium herbaceum L. and G. arboreum L. highlight how wet climate phases determined Levant Cotton domestication and spread. bioRxiv preprint, DOI 10.64898/2026.01.14.699536. A preprint: not peer reviewed.", "url": "https://doi.org/10.64898/2026.01.14.699536", "accessed": "2026-08-25", "supports": "G. arboreum cultivation spreading across South Asia from the mid-fifth millennium BP, roughly 3,000 years after its first textile use; G. herbaceum expanding around the end of the third millennium BP across north-east Africa; wet climate phases including the African Humid Period of 7000-5000 BP proposed as the enabling condition, and early textile remains from southern Levant and Nile Valley sites", "kind": "scholarly"}], "verification": "contested", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "three-sisters-intercropping", "label": "The three sisters", "change": "Three crops grown together that each fix what the others lack.", "title": "Mesoamerica plants maize, beans and squash as one system", "type": "invention", "layer": "knowledge", "date": {"start": -6000, "end": -1500, "precision": "range"}, "location": {"name": "Mesoamerica", "lat": 18.3, "lng": -99.5, "region": "americas-meso"}, "categories": ["agriculture"], "question": "How do you keep growing on the same ground without exhausting it?", "answer": "Grow three plants together whose needs and outputs fit: the maize stalk carries the beans, the beans put nitrogen back, the squash shades out the weeds.", "significance": "This is agronomy as a system rather than a crop, and each part does work the others cannot: the cornstalk is a trellis, the bean vines fix nitrogen and steady the maize against wind, and the broad squash leaves hold moisture in the soil and suppress weeds. The nutrition closes the same way — maize, beans and squash together supply all nine essential amino acids, where maize alone does not. Squash was domesticated first, thousands of years before maize and beans joined it, so the system was assembled over millennia rather than designed.", "sources": [{"citation": "\"Three Sisters (agriculture)\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/Three_Sisters_(agriculture)", "accessed": "2026-08-26", "supports": "the three crops and the agronomic mechanism — cornstalk as trellis, beans fixing nitrogen and stabilising the maize, squash leaves shading soil and suppressing weeds; origin in Mesoamerica with squash domesticated first around 8,000-10,000 years ago and maize and beans following over the next 5,000-6,500 years; the nine essential amino acids supplied by the three together", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "green-sahara-pastoralism", "label": "Green Sahara herders", "change": "Herding reached the Sahara as an idea, carried by almost nobody.", "title": "Pastoralism enters the Sahara without the herders moving in", "type": "discovery", "layer": "knowledge", "date": {"start": -5050, "end": -4950, "precision": "circa"}, "location": {"name": "Takarkori rock shelter, south-western Libya", "lat": 24.8, "lng": 10.6, "region": "africa-sub-saharan"}, "categories": ["agriculture", "society"], "question": "The grass is coming back. Do we follow the animals, or keep them?", "answer": "Not here. Genomes from roughly 7,000-year-old Pastoral Neolithic women at Takarkori belong to a deeply divergent, isolated North African lineage.", "significance": "Most of the ancestry at Takarkori comes from a previously unknown North African lineage that split from sub-Saharan lineages around the same time as the populations who left Africa, meaning these herders were long isolated rather than recently arrived. Pastoralism therefore spread into the Sahara by cultural diffusion, during an African Humid Period running from about 14,500 to 5,000 years before present. A third independent line of evidence points the same way: the megalith genomes and the Minoan mitochondria both showed practices moving without populations moving.", "sources": [{"citation": "Salem, N., et al. (2025). Ancient DNA from the Green Sahara reveals ancestral North African lineage. Nature, 641, 144-150. DOI 10.1038/s41586-025-08793-7.", "url": "https://doi.org/10.1038/s41586-025-08793-7", "accessed": "2026-08-26", "supports": "roughly 7,000-year-old Pastoral Neolithic individuals from Takarkori rock shelter, Libya; the majority of their ancestry from a previously unknown North African lineage diverging from sub-Saharan lineages around the same time as present-day humans outside Africa; pastoralism spreading by cultural diffusion into a deeply divergent isolated lineage; the African Humid Period at 14,500-5,000 years BP", "kind": "scholarly"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "manufactured", "era": "trunk"}, {"id": "araba-copper", "label": "Araba copper", "change": "Ore dug, roasted and smelted into metal, in the desert where it lay.", "title": "The southern Levant turns green rock into copper", "type": "invention", "layer": "knowledge", "date": {"start": -4500, "end": -3300, "precision": "range"}, "location": {"name": "The Araba Valley, between the Dead Sea and the Red Sea", "lat": 30.6, "lng": 35.2, "region": "levant-anatolia"}, "categories": ["technology", "materials"], "question": "This green stone is not a stone. What is it, and what gets it out?", "answer": "Heat, and a great deal of it. Copper ore mined in the Araba was smelted on the spot, and mining there runs from the Chalcolithic onward.", "significance": "Smelting is the first time people make a material that does not exist in nature in usable form, and it requires holding a fire far hotter than cooking needs while controlling what the air does to the charge — knowledge with no visible precedent in stone-working. The Araba preserves one of the best archaeological records of that activity anywhere, in four industrial hubs and a scatter of isolated mines documented at fourteen sites, some small surface pits and some extensive underground workings. What those outlying mines show is that production was not only centralised: they point to flexible, locally managed exploitation running alongside the big complexes.", "sources": [{"citation": "Langford, B., Kutuzov, I., Frumkin, A., & Ben-Yosef, E. (2026). Copper mines in the Araba Valley (SE Israel & SW Jordan): Spatial distribution, site typology and new discoveries. Journal of Arid Environments, 233, 105557. DOI 10.1016/j.jaridenv.2026.105557.", "url": "https://doi.org/10.1016/j.jaridenv.2026.105557", "accessed": "2026-09-18", "supports": "the Araba Valley as a major ancient centre of copper mining and smelting with one of the best-preserved metallurgical records in the world; four principal industrial hubs at Faynan, Wadi Abu Khushayba, Timna and Nahal Amram; 14 documented mining sites from small surface pits to extensive underground workings; evidence for decentralised, locally managed production alongside the major complexes; the span of production from the Chalcolithic through the Late Islamic period", "kind": "scholarly"}, {"citation": "\"Chalcolithic\", Wikipedia. An encyclopedia entry, cited only to date the Chalcolithic, because the scholarly source above gives the period name and not absolute years.", "url": "https://en.wikipedia.org/wiki/Chalcolithic", "accessed": "2026-09-18", "supports": "the Chalcolithic of the southern Levant conventionally placed in the fifth and fourth millennia BCE", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "potters-wheel", "label": "The potter's wheel", "change": "A pot thrown on a spinning disc, round by rotation rather than by hand.", "title": "The potter's wheel is a different invention from the cart's", "type": "invention", "layer": "knowledge", "date": {"start": -4500, "end": -3100, "precision": "range"}, "location": {"name": "Cucuteni-Trypillia sites in western Ukraine, and later Mesopotamia", "lat": 48.9, "lng": 25.4, "region": "europe-north-east"}, "categories": ["technology", "materials"], "question": "How do you make a vessel that is truly round, quickly, and the same every time?", "answer": "Let the vessel turn instead of the hands. Rotation does the shaping, and the potter only has to hold still.", "significance": "These are two inventions and they are routinely treated as one. A potter's wheel turns about a fixed vertical point under no load worth the name; a cart wheel carries weight on a horizontal axle while rolling over ground, which is a far harder mechanical problem and arrives later. The potter's version is attested earlier — a Cucuteni-Trypillia example from western Ukraine in the middle of the 5th millennium BCE, ahead of the Mesopotamian ones, with the Ur example around 3100 BCE. Rotation as a way of making things identical is the idea here, and it arrives before rotation as a way of moving loads.", "sources": [{"citation": "\"Wheel\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/Wheel", "accessed": "2026-09-21", "supports": "potter's wheels in use in the Middle East in the 4th millennium BCE, with a Cucuteni-Trypillia example from western Ukraine in the mid-5th millennium BCE and the Ur example c. 3100 BCE; the Ljubljana Marshes cart wheel at 3340-3030 BCE, later than the earliest potter's wheels", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "sumerian-irrigation", "label": "Irrigation", "change": "Water steered onto land, turning a floodplain into a surplus.", "title": "Sumer learns to steer water, and the surplus makes cities possible", "type": "invention", "layer": "knowledge", "date": {"start": -4050, "end": -3250, "precision": "range"}, "location": {"name": "Lagash and the coastal plain of Sumer, southern Mesopotamia", "lat": 31.42, "lng": 46.4, "region": "mesopotamia"}, "categories": ["agriculture", "engineering"], "question": "How do you feed a town on a plain where the rain does not fall and the river will not stay put?", "answer": "Take the water to the field instead of waiting for it, first using the tides and later by cutting canals.", "significance": "Every other Mesopotamian entry sits on top of the surplus this produced, and the surplus is hard to explain before large-scale irrigation existed. Satellite topography and a drill core at Lagash support tidal irrigation as the jump-start for high-yield diversified agriculture during the Uruk period, with the shift to the expansive fluvial canal networks of the Early Dynastic city-states following as the delta advanced and cut off access to the sea. That makes the first agricultural engine a feature of the coast rather than of the river, and a response to a landscape that was itself moving.", "sources": [{"citation": "Giosan, L., & Goodman, R. (2025). Morphodynamic Foundations of Sumer. PLoS One, 20, e0329084. DOI 10.1371/journal.pone.0329084.", "url": "https://doi.org/10.1371/journal.pone.0329084", "accessed": "2026-08-24", "supports": "the Uruk period dated c. 6,000-5,200 y BP; the difficulty of explaining agricultural surplus before large-scale irrigation; high-resolution satellite topography and a drill core at Lagash/Tell Al Hiba; tidal irrigation proposed as a jump-starting mechanism for high-yield diversified agriculture; the later shift to the expansive fluvial irrigation network of Early Dynastic city-states as delta build-up restricted sea access", "kind": "scholarly"}], "verification": "unverified", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "dromedary-domestication", "label": "The dromedary", "change": "An animal that crosses desert, so desert stops being a wall.", "title": "Arabia domesticates the animal that makes desert crossable", "type": "invention", "layer": "knowledge", "date": {"start": -4000, "end": -3000, "precision": "range"}, "location": {"name": "The southern Arabian Peninsula", "lat": 15.5, "lng": 47.0, "region": "arabia-islamicate"}, "categories": ["agriculture", "biology", "transport"], "question": "How do you cross ground where there is no water for days?", "answer": "On an animal built for it — one that can lose 30% of its body water, shut its nostrils, and carry a load while doing so.", "significance": "Deserts function as barriers until something can carry cargo across them, and the dromedary is that something: it tolerates water loss above 30%, closes its nostrils voluntarily, lets its body temperature swing between about 31 and 42 degrees to avoid sweating, and stores up to 36 kg of fat in the hump. It is also the only mammal with oval red blood cells, which keeps blood flowing when dehydrated. Domesticated in southern Arabia around 4000-3000 BC, it turns the Arabian and later the Saharan interior from an edge into a route.", "sources": [{"citation": "\"Dromedary\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/Dromedary", "accessed": "2026-08-26", "supports": "first domestication in the southern Arabian Peninsula around 4000-3000 BC and North African presence by 1500 BC with a possible separate domestication around 1000 BC; voluntary nostril closure; tolerance of greater than 30 percent water loss; body temperature fluctuating from 31 to 41.7 degrees C; water-conserving kidneys; oval red blood corpuscles facilitating blood flow during dehydration; up to 36 kg of fat stored in the hump; increased trans-Saharan carrying capacity", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "silk-and-sericulture", "label": "Silk", "change": "An insect farmed for its thread, and bred until it cannot live wild.", "title": "China domesticates a moth and reels thread from its cocoon", "type": "invention", "layer": "knowledge", "date": {"start": -4000, "end": -3000, "precision": "range"}, "location": {"name": "The Yellow River valley; Yangshao sites in Shanxi and Henan", "lat": 34.8, "lng": 111.2, "region": "east-asia"}, "categories": ["technology", "biology", "materials"], "question": "Is there a thread better than the ones we twist from plants and hair?", "answer": "A moth larva spins one and winds it into a cocoon, if you can get it off again unbroken.", "significance": "Silk is not spun from short fibres the way plant and animal fibres are: the cocoon is soaked and the thread wound off onto spools, so the technique is unwinding rather than twisting. The domestication went unusually far: Bombyx mori differs from its wild ancestor B. mandarina in that its silk glands have shifted from a protective, stress-responsive cellular state to a synthesis-optimised one — bred so far toward production that it no longer survives without people. Woven silk fabric is present in Henan by about 3630 BC and silk fibroin appears at Jiahu some 8,500 years ago, so the practice is far older than the trade that later carried it.", "sources": [{"citation": "Ma, Y., Zhang, Z., Fang, Z., Tang, Y., Ma, Z., Cheng, L., Yu, X., Jiang, D., Li, X., & Xu, H. (2026). Single-cell deconvolution reveals phenotype-associated cellular states in the silk glands of Bombyx mori and its wild ancestor. Insects, 17(2), 209. DOI 10.3390/insects17020209.", "url": "https://doi.org/10.3390/insects17020209", "accessed": "2026-09-18", "supports": "domestication reshaping the silk gland cellular landscape toward a synthesis-optimised state, against the protective-adaptive, stress-responsive state of the wild ancestor B. mandarina", "kind": "scholarly"}, {"citation": "\"History of silk\", Wikipedia. An encyclopedia entry, cited for the archaeological dates because the scholarly source above is cell biology and gives none.", "url": "https://en.wikipedia.org/wiki/History_of_silk", "accessed": "2026-09-18", "supports": "silk fibroin at Jiahu c. 8,500 years ago; a cut B. mori cocoon at Yangshao sites in Xia County, Shanxi, 4000-3000 BC; the earliest woven silk fabric at Qingtaicun, Henan, c. 3630 BC; the reeling process of soaking cocoons and winding the silk onto spools - described on the page in a caption to a 13th-century CE illustration, not attested for the period of this entry", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "secondary-products", "label": "Secondary products", "change": "Wool, milk and pulling power — the animal used without being killed.", "title": "Herds start being used for what they make, not what they are", "type": "discovery", "layer": "knowledge", "date": {"start": -4000, "end": -2000, "precision": "range"}, "location": {"name": "South-west Asia and the Old World farming zone", "lat": 36.0, "lng": 42.0, "region": "mesopotamia"}, "categories": ["agriculture", "technology", "society"], "question": "Is a live animal worth more than a dead one?", "answer": "Once you can take wool, milk and traction from it, yes — repeatedly, for years, instead of once.", "significance": "Andrew Sherratt proposed in 1981 that a linked set of innovations — milking, wool, animals harnessed to the plough, riding and pack transport — transformed Old World farming from the fourth and third millennia BCE, reaching Europe by the start of the third. The idea reframes the herd as capital rather than as stored meat, and it is why a plough animal and a fleece belong in the same entry as a milk pail. The model has been contested and revised: critics warned against dating innovations from iconography and waterlogged remains, milk residues have pushed milking back into the Neolithic in north-western Anatolia, and the current reading is a change in scale during the Chalcolithic and Bronze Age rather than a single moment of invention.", "sources": [{"citation": "\"Secondary products revolution\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/Secondary_products_revolution", "accessed": "2026-08-26", "supports": "Sherratt's 1981 proposal of a broadly contemporaneous set of innovations in Old World farming; the secondary products of milk, wool, traction, riding and pack transport; dates from the 4th-3rd millennia BCE reaching Europe by the start of the third millennium; criticism of dating from iconography and waterlogged remains; milk residues pushing milking back into the Neolithic in north-western Anatolia; the revised reading as a change in the scale of production during the Chalcolithic and Bronze Age", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "the-wheel", "label": "The wheel", "change": "A load that rolls instead of dragging, once the axle problem is solved.", "title": "The wheeled vehicle appears, thousands of years after farming", "type": "invention", "layer": "knowledge", "date": {"start": -3631, "end": -3030, "precision": "range"}, "location": {"name": "Bronocice, southern Poland; and the Ljubljana Marshes", "lat": 50.3, "lng": 20.4, "region": "europe-north-east"}, "categories": ["technology", "transport"], "question": "Is there a way to move a load that does not mean dragging it?", "answer": "A disc turning on a fixed axle — but only once you can cut a round hole and a round shaft that fit and still turn.", "significance": "The wheel arrives late, several millennia after farming and after pottery, and the reason is the axle rather than the wheel: a disc is easy and a hole that stays round under load while a shaft turns inside it is not. The earliest evidence is a picture rather than an object — a wheeled vehicle drawn on the Bronocice pot in southern Poland between 3631 and 3380 BCE, with comparable wagon pictographs at Uruk around 3500-3350 BCE — and the oldest surviving wooden wheel, from the Ljubljana Marshes, is later at 3340-3030 BCE. That a technology this useful waited so long is the argument against reading invention as the inevitable result of need.", "sources": [{"citation": "\"Wheel\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/Wheel", "accessed": "2026-09-21", "supports": "depictions of a wheeled vehicle on the Bronocice pot from a Funnelbeaker settlement in southern Poland, 3631-3380 BCE; wheeled-wagon pictographs on clay tablets at the Eanna district of Uruk c. 3500-3350 BCE; the Ljubljana Marshes wheel dated 3340-3030 BCE with its axle at 3360-3045 BCE, the oldest wooden wheel yet found; several wheel-less millennia after the invention of agriculture and pottery", "kind": "tertiary"}], "verification": "unverified", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "megalith-culture-not-kin", "label": "Megalith tombs", "change": "Communal graves shared by people who were often not related at all.", "title": "Europe's great tombs hold people who were not related", "type": "discovery", "layer": "knowledge", "date": {"start": -3600, "end": -2800, "precision": "range"}, "location": {"name": "Western Funnel Beaker and Wartberg sites, central Europe", "lat": 51.3, "lng": 9.0, "region": "europe-west"}, "categories": ["society", "architecture"], "question": "Who is allowed into the tomb?", "answer": "Not only for a family. Genome-wide data from 203 people in six megalithic complexes shows communal burial grounds that were not restricted to close genetic relatives.", "significance": "Megalithic monuments are usually read as symbols of shared ancestry, and the genetics does not support the simple version: individuals from two archaeologically distinct groups form one genetically homogeneous population, first- and second-degree relatives turn up as far as 225 km apart, and the tombs were not reserved for close kin — social kinship mattered. The finding that carries furthest is about the monuments themselves: limited genetic connection to distant European megalithic populations indicates that monumentality spread culturally rather than through biological networks. An idea moved across Europe without the people carrying it having to.", "sources": [{"citation": "da Silva, N. A., Nebel, A., Kolbe, D., Myburgh, D. A., Klimscha, F., Gorner, I., Fuchs, K., Meyer, C., Schierhold, K., Rind, M., Hoffmann, R., Franke, A., Meadows, J., Rinne, C., Muller, J., & Krause-Kyora, B. (2026). Long-distance genetic relatedness in megalithic central Europe. Science, 392, 839-844. DOI 10.1126/science.aeb2926.", "url": "https://doi.org/10.1126/science.aeb2926", "accessed": "2026-08-25", "supports": "genome-wide data from 203 individuals in six megalithic grave complexes of the Western Funnel Beaker and Wartberg groups; the two archaeologically distinct groups forming one genetically homogeneous population; first- and second-degree relationships spanning up to 225 km; communal burial grounds not exclusively for close genetic relatives, indicating social kinship; limited genetic connection to distant European megalithic populations, indicating monumentality spread culturally rather than biologically", "kind": "scholarly"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "manufactured", "era": "trunk"}, {"id": "egyptian-embalming", "label": "Embalming", "change": "A seventy-day chemical procedure for stopping a body decaying.", "title": "Egypt works out how to keep a body from rotting", "type": "invention", "layer": "knowledge", "date": {"start": -3600, "end": -2181, "precision": "range"}, "location": {"name": "Egypt", "lat": 25.7, "lng": 32.64, "region": "egypt-nile"}, "categories": ["medicine", "technology", "materials"], "question": "How do you stop a body decaying?", "answer": "Take out what rots fastest, dry the rest in natron for over a month, and seal it with resins and tars brought from abroad.", "significance": "Embalming is applied chemistry and applied anatomy, whatever it was done for: the organs most prone to putrefaction come out, the brain is drawn through the nose, the body is dehydrated in natron for roughly 35 to 40 days of a process lasting up to seventy, and the result is sealed. It required knowing where the organs are and which ones matter, and it produced that knowledge in a society that otherwise had no reason to open a body. The sealing compounds were not local — archaeo-metabolomic markers identify cedar tar, made by dry distillation, in Egyptian mummification balms, so the recipe reaches beyond Egypt's own materials.", "sources": [{"citation": "Huber, B., Pollet, O., Kandil, S. B., et al. (2026). An archaeo-metabolomics approach for identifying cedar tar in archaeological samples: differentiating plant products and production processes. Scientific Reports, 16, 14280. DOI 10.1038/s41598-026-50080-6.", "url": "https://doi.org/10.1038/s41598-026-50080-6", "accessed": "2026-08-26", "supports": "chemical markers detected in ancient Egyptian mummification balms giving direct evidence for cedar tar in embalming mixtures, with diagnostic compounds revealing both cedar origin and dry distillation processing. Note: the balms analysed date to 664-332 BCE, later than this entry's range", "kind": "scholarly"}, {"citation": "Zesch, S., Panzer, S., Paladin, A., et al. (2024). The multifaceted nature of Egyptian mummification: Paleoradiological insights into child mummies. PLoS One, 19, e0316018. DOI 10.1371/journal.pone.0316018.", "url": "https://doi.org/10.1371/journal.pone.0316018", "accessed": "2026-08-26", "supports": "variation in wrapping and embalming technique and in removal of the brain and internal organs, depending on age at death, social status and archaeological site", "kind": "scholarly"}, {"citation": "\"Ancient Egyptian funerary practices\", Wikipedia. An encyclopedia entry, cited for the dates and the procedure, because the scholarly sources above analyse later material.", "url": "https://en.wikipedia.org/wiki/Ancient_Egyptian_funerary_practices", "accessed": "2026-08-26", "supports": "mummification beginning by 3600 BCE and becoming sophisticated by the Old Kingdom c. 2686-2181 BCE; brain removal through the nostril; organs placed in canopic jars with the heart retained; dehydration in natron; a process taking up to seventy days with 35-40 days of dehydration", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "titicaca-agriculture", "label": "Altiplano farming", "change": "High-altitude farming taken up from strength, not from hunger.", "title": "Farming begins in the Titicaca basin as resilience, not as hardship", "type": "discovery", "layer": "knowledge", "date": {"start": -3550, "end": -1050, "precision": "range"}, "location": {"name": "The Titicaca Basin, southern Peru and Bolivia", "lat": -16.0, "lng": -69.0, "region": "americas-andean"}, "categories": ["agriculture", "society"], "question": "We are eating well enough as it is. Is it worth breaking this ground too?", "answer": "Not because they had to. The isotope, animal and plant evidence reads as spreading risk rather than escaping scarcity.", "significance": "The standard story of agriculture is pressure: population or climate forces a shift that nobody would otherwise choose. Isotope chemistry, zooarchaeology and archaeobotany across Titicaca Basin sites between about 5,500 and 3,000 years ago read the opposite way, as a process of economic resilience rather than hardship. If that holds, farming is something people added to a working economy rather than something they were driven into, which changes what the Neolithic was.", "sources": [{"citation": "Flores-Blanco, L., Hall, M., Hinostroza, L., Eerkens, J., Aldenderfer, M., & Haas, R. (2025). Altiplano agricultural origins was a process of economic resilience, not hardship: Isotope chemistry, zooarchaeology, and archaeobotany in the Titicaca Basin, 5.5-3.0 ka. PLOS ONE, 20, e0325626. DOI 10.1371/journal.pone.0325626.", "url": "https://doi.org/10.1371/journal.pone.0325626", "accessed": "2026-08-24", "supports": "agricultural origins in the Titicaca Basin between 5.5 and 3.0 ka, characterised as a process of economic resilience rather than hardship, on isotope chemistry, zooarchaeology and archaeobotany; the Terminal Archaic Period at 5.0-3.5 cal ka", "kind": "scholarly"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "manufactured", "era": "trunk"}, {"id": "cylinder-seal", "label": "The cylinder seal", "change": "A mark that proves who sealed a thing, and that nobody opened it since.", "title": "A rolled stone becomes a signature that cannot be forged by hand", "type": "invention", "layer": "knowledge", "date": {"start": -3500, "end": -3300, "precision": "circa"}, "location": {"name": "Uruk, southern Mesopotamia, and Susa", "lat": 31.32, "lng": 45.64, "region": "mesopotamia"}, "categories": ["administration", "technology"], "question": "How do you prove a document is yours, and that the jar has not been opened since you closed it?", "answer": "Carve a design into a small stone cylinder and roll it across wet clay. The impression is unique, continuous, and impossible to reproduce freehand.", "significance": "The seal authenticates rather than records, and the difference matters: writing says what was agreed, the seal says who agreed it and whether it has been broken since. Rolled across tablets, jar stoppers, doors and envelopes, it does at once the work of a signature, a property mark, a tamper-evident closure and a maker's brand. The stone had to be imported — hematite, lapis, carnelian, obsidian — because Mesopotamia has no good stone, so the technology of trust arrives on the back of the long-distance trade it then helps secure.", "sources": [{"citation": "\"Cylinder seal\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/Cylinder_seal", "accessed": "2026-08-25", "supports": "invention around 3500 BC at Uruk and slightly later at Susa; rolling to impress clay tablets, cloth, bricks, storage jars, doors, envelopes and amulets; use as signature, ownership mark, tamper-prevention and product branding; carving from imported hardstones including hematite, obsidian, lapis lazuli and carnelian because Mesopotamia lacked quality stone; use from the end of the 4th millennium BCE until the 5th century BCE", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trun
