k", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "egyptian-hieroglyphs", "label": "Hieroglyphs", "change": "A script mixing pictures, sounds and silent category markers.", "title": "Egypt writes with pictures that are also sounds", "type": "invention", "layer": "knowledge", "date": {"start": -3400, "end": -3200, "precision": "range"}, "location": {"name": "Abydos, Upper Egypt", "lat": 26.18, "lng": 31.92, "region": "egypt-nile"}, "categories": ["writing", "language"], "question": "How do you write a word that cannot be drawn, and tell apart two words that sound the same?", "answer": "Use three kinds of sign at once: pictures standing for things, pictures standing for sounds, and silent signs marking which kind of thing is meant.", "significance": "The determinative is the clever part and it has no counterpart in an alphabet: a sign that is never pronounced, added to say what category the written word belongs to, which resolves the ambiguity a consonant-only script creates. Sign counts grow rather than shrink, from around 800 known through the Old, Middle and New Kingdoms to more than 5,000 by the Greco-Roman period, the opposite of the contraction cuneiform underwent. Whether Egypt got the idea of writing from Sumer is unsettled, and the Abydos material at c. 3400-3200 BC is what makes independent development arguable rather than assumed.", "sources": [{"citation": "\"Egyptian hieroglyphs\", Wikipedia. An encyclopedia entry. The scholarly treatments attempted for this entry were paywalled - see the slice file's research log.", "url": "https://en.wikipedia.org/wiki/Egyptian_hieroglyphs", "accessed": "2026-08-24", "supports": "earliest hieroglyphic writing from Abydos dated c. 3400-3200 BC; logograms, phonograms including 24 uniliteral signs, and mute determinatives; around 800 signs across the Old, Middle and New Kingdoms rising to more than 5,000 by the Greco-Roman period; Sampson's argument for Mesopotamian influence against the Abydos evidence for independent development, with no definitive determination made", "kind": "tertiary"}], "verification": "unverified", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "tyrolean-iceman", "label": "The Iceman", "change": "One frozen body, fully equipped, dating the Copper Age directly.", "title": "A man crosses the Alps carrying everything he needs", "type": "discovery", "layer": "knowledge", "date": {"start": -3350, "end": -3100, "precision": "circa"}, "location": {"name": "The Otztal Alps, on the present Italian-Austrian border", "lat": 46.78, "lng": 10.84, "region": "europe-west"}, "categories": ["technology", "biology"], "question": "What must a person carry to get over these mountains alone?", "answer": "We know, because one of them froze intact with everything on him, about 5,300 years ago.", "significance": "Almost everything known about prehistory is inferred from what survives by accident of durability — stone, bone, fired clay — and durable things are a biased sample of what people had. A natural glacier mummy is the exception: skin, gut contents, clothing, tools and injuries preserved together, so the Copper Age is available as a person rather than as an assemblage. The body is still yielding results decades later, from the microbial communities it carried to fungal DNA in the gut and a clinical re-reading of how he was hurt.", "sources": [{"citation": "Weber, J., Wahl, J., Samadelli, M., & Zink, A. (2025). New insights on Otzi's injuries from a clinical perspective. Scientific Reports, 15, 42555. DOI 10.1038/s41598-025-27969-9.", "url": "https://doi.org/10.1038/s41598-025-27969-9", "accessed": "2026-08-25", "supports": "the Tyrolean Iceman discovered in the Tyrolean Alps in 1991; a remarkably well-preserved natural mummy estimated at around 5,300 years old, dating to the Copper Age; a clinical re-examination of his injuries", "kind": "scholarly"}, {"citation": "Sarhan, M. S., Samadelli, M., Zink, A., & Maixner, F. (2026). The Iceman's microbiome: unveiling millennia of microbial diversity and continuity. Microbiome, 14, 135. DOI 10.1186/s40168-026-02417-6.", "url": "https://doi.org/10.1186/s40168-026-02417-6", "accessed": "2026-08-25", "supports": "the Iceman as a 5,300-year-old natural alpine glacier mummy offering a unique opportunity to study ancient microbial ecosystems", "kind": "scholarly"}, {"citation": "Oskolkov, N., Sandionigi, A., Gotherstrom, A., Canini, F., Turchetti, B., Zucconi, L., Mimmo, T., Buzzini, P., & Borruso, L. (2024). Unraveling the ancient fungal DNA from the Iceman gut. BMC Genomics, 25, 1225. DOI 10.1186/s12864-024-11123-2.", "url": "https://doi.org/10.1186/s12864-024-11123-2", "accessed": "2026-08-25", "supports": "recovery of ancient fungal DNA from the Iceman's gut and the reading that he consumed the fungi in association with other elements of his diet", "kind": "scholarly"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "manufactured", "era": "trunk"}, {"id": "proto-cuneiform-accounting", "title": "Writing is invented to count things, not to say them: proto-cuneiform at Uruk", "type": "invention", "layer": "knowledge", "date": {"start": -3350, "end": -3000, "precision": "circa"}, "location": {"name": "Uruk, southern Mesopotamia", "lat": 31.32, "lng": 45.64, "region": "mesopotamia"}, "branch": "trunk", "categories": ["writing", "mathematics", "administration"], "question": "How can a temple household keep account of more grain, livestock and labour than any one person can hold in memory or any counterparty can be trusted to confirm?", "question_status": "reconstructed", "answer": "Impress a standardised repertoire of commodity signs and number signs into clay, producing a record that outlasts the transaction and can be checked by someone who was not present at it.", "significance": "Obligation could now outrun memory and personal trust, which is what an institution larger than its members requires. Roughly 85 percent of the surviving tablets are administrative. It does not record speech, and it has no single idea of number: thirteen notations run in parallel, so grain, barley and emmer are each counted in their own and a quantity cannot leave the substance it counts.", "links": {"builds_on": ["clay-token-accounting"], "leads_to": ["cuneiform-phonetization", "lexical-lists"]}, "sources": [{"citation": "\"Proto-cuneiform\", Wikipedia. An encyclopedia entry. It reports Englund (2011), Nissen (2016), Glassner (2020) and Pandey (2020); those works are not cited here directly.", "url": "https://en.wikipedia.org/wiki/Proto-cuneiform", "accessed": "2026-08-24", "supports": "Uruk IV and Uruk III dating, the 85/15 administrative-to-lexical split and its distribution, the sign counts, the consensus that the script does not transcribe language, the thirteen commodity-specific numerical systems", "kind": "tertiary"}], "verification": "unverified", "tier": 1, "label": "Writing", "change": "Records that outlive the deal. Invented for accounting, not for speech.", "era": "trunk"}, {"id": "steppe-dairying", "label": "Milk", "change": "Living off what an animal makes while alive, not off killing it.", "title": "The steppe starts drinking milk, and the grasslands open up", "type": "discovery", "layer": "knowledge", "date": {"start": -3300, "end": -2500, "precision": "range"}, "location": {"name": "The Pontic-Caspian steppe", "lat": 47.5, "lng": 40.0, "region": "europe-north-east"}, "categories": ["agriculture", "biology", "society"], "question": "How do you live off a herd in country that will not feed a farm?", "answer": "Take what the animal produces while it lives. Dairying appears suddenly and everywhere at the start of the Bronze Age.", "significance": "A herd that is milked rather than eaten supports people on grassland that cannot be farmed, and that is what makes the steppe crossable rather than marginal. Proteomic analysis of dental calculus from western Eurasian steppe individuals shows a major and rapid transition to ubiquitous dairying exactly when these populations are known to have begun dispersing, and horse milk proteins put horse domestication in the Pontic-Caspian steppe by the third millennium BC. The same study is careful about what it does not show: hard evidence for horse traction and bulk wagon transport, long assumed to explain the expansion, has not been found.", "sources": [{"citation": "Wilkin, S., Ventresca Miller, A., Fernandes, R., Spengler, R., Taylor, W. T. T., Brown, D. R., Reich, D., Kennett, D. J., Culleton, B. J., et al. (2021). Dairying enabled Early Bronze Age Yamnaya steppe expansions. Nature, 598, 629-633. DOI 10.1038/s41586-021-03798-4.", "url": "https://doi.org/10.1038/s41586-021-03798-4", "accessed": "2026-08-24", "supports": "Early Bronze Age expansion of western Eurasian steppe populations; proteomic analysis of dental calculus showing a major transition to ubiquitous dairying at the start of the Bronze Age, coincident with dispersal; horse milk proteins indicating horse domestication by the Early Bronze Age with a potential epicentre in the Pontic-Caspian steppe by the third millennium BC; the explicit statement that hard evidence for horse traction and bulk wagon transport has not been found", "kind": "scholarly"}], "verification": "contested", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "indus-cities", "label": "Indus cities", "change": "A settlement system so large it is now mapped from orbit.", "title": "The Indus builds a settlement network that shifts with its rivers", "type": "invention", "layer": "knowledge", "date": {"start": -3300, "end": -1500, "precision": "range"}, "location": {"name": "Cholistan, Punjab, present-day Pakistan", "lat": 28.5, "lng": 71.5, "region": "south-asia"}, "categories": ["society", "engineering"], "question": "Where do you put a city when the river that feeds it will move?", "answer": "Not in one place. Settlement across the Indus plain shifts continuously, tracking a changing river network.", "significance": "This is urban life organised around impermanence rather than against it. Machine-learning classification of multisensor satellite data over Cholistan, the largest concentration of Indus settlement, found extensive archaeological mounds and continuous shifts in settlement location, read as responses to a dynamic hydrological network. A civilisation that relocates its towns as the water moves is solving a different problem from one that builds a permanent capital.", "sources": [{"citation": "Orengo, H. A., Conesa, F. C., Garcia-Molsosa, A., Lobo, A., Green, A. S., Madella, M., & Petrie, C. A. (2020). Automated detection of archaeological mounds using machine-learning classification of multisensor and multitemporal satellite data. Proceedings of the National Academy of Sciences, 117, 18240-18250. DOI 10.1073/pnas.2005583117.", "url": "https://doi.org/10.1073/pnas.2005583117", "accessed": "2026-08-24", "supports": "extensive archaeological mounds across Cholistan, the largest Indus Civilization settlement concentration, dated circa 3300-1500 BC; continuous shifts in settlement location read as responses to a dynamic and changing hydrological network", "kind": "scholarly"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "neolithic-decline", "label": "The Neolithic decline", "change": "Farming Europe empties out, and the megaliths stop being built.", "title": "Europe's first farmers thin out, and the monuments stop", "type": "discovery", "layer": "knowledge", "date": {"start": -3100, "end": -2900, "precision": "range"}, "location": {"name": "Bury, Paris Basin, northern France", "lat": 49.28, "lng": 2.2, "region": "europe-west"}, "categories": ["society", "biology"], "question": "The fields are going back to forest and the sick are not recovering. Who is left to build?", "answer": "Because the people building them go. At Bury the burials before and after the gap are largely different genetic groups, organised differently.", "significance": "A population decline at the turn of the third and fourth millennia BC coincides with the end of megalith building across continental north-west Europe, and 132 ancient genomes from a single burial monument show what that looked like on the ground: two burial phases separated by a hiatus, genetically discontinuous, with markedly different social organisation read from three large pedigrees. The gap is filled by Neolithic ancestry moving north into the Paris Basin only after the decline, around 2900 BC, and the dataset carries Yersinia pestis and Borrelia recurrentis alongside evidence of forest regrowing over abandoned fields. Knowledge is not only invented and transmitted; it is also dropped, and this is what that looks like in the record.", "sources": [{"citation": "Seersholm, F. V., Ramsoe, A., Cao, J., Chambon, P., Sjogren, K. G., McColl, H., Demeter, F., Gaunitz, C., Vinner, L., Stenderup, J., et al. (2026). Population discontinuity in the Paris Basin linked to evidence of the Neolithic decline. Nature Ecology & Evolution, 10, 677-688. DOI 10.1038/s41559-026-03027-z.", "url": "https://doi.org/10.1038/s41559-026-03027-z", "accessed": "2026-08-25", "supports": "population decline at the third-fourth millennium BC transition concurrent with the end of megalith building across continental north-western Europe; 132 ancient genomes from the allee sepulcrale at Bury; two burial phases separated by a hiatus, genetically discontinuous, with different social organisation from three large pedigrees; northward movement of Neolithic ancestry into the Paris Basin around 2900 BC; Yersinia pestis and Borrelia recurrentis in the dataset; forest regrowth between the phases", "kind": "scholarly"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "manufactured", "era": "trunk"}, {"id": "proto-elamite", "label": "Proto-Elamite", "change": "A second script, east of Sumer, still unread after four thousand years.", "title": "Iran writes in a script of its own, and nobody has read it since", "type": "invention", "layer": "knowledge", "date": {"start": -3100, "end": -2700, "precision": "range"}, "location": {"name": "Susa and Tepe Sialk, south-western Iran", "lat": 32.19, "lng": 48.26, "region": "persia-central-asia"}, "categories": ["writing", "language"], "question": "If the neighbours are writing, do you borrow their script or make your own?", "answer": "Make your own. Proto-Elamite appears c. 3100-2700 BCE, the first writing in Iran, and it has never been fully deciphered.", "significance": "Iran sat next to the world's first literate society and did not simply adopt its script: Proto-Elamite is a separate system, contemporary with early cuneiform, and the seals that accompany it share stylistic elements with Uruk-period seals without the writing being the same writing. It joins the Indus script as a second undeciphered writing system, which is worth sitting with — two of the era's literate societies are still silent, and what is known of them comes from objects rather than from anything they wrote about themselves.", "sources": [{"citation": "\"Proto-Elamite\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/Proto-Elamite", "accessed": "2026-08-26", "supports": "Proto-Elamite writing c. 3100-2700 BCE as the first writing in Iran, found at Tepe Sialk; the script not yet completely deciphered; Proto-Elamite seals following Uruk-period seals and sharing stylistic elements; its precedence before the introduction of Elamite cuneiform", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "eastern-agricultural-complex", "label": "Sleeping crops", "change": "North America domesticated its own crops, then stopped growing them.", "title": "Eastern North America domesticates a set of crops and later abandons them", "type": "invention", "layer": "knowledge", "date": {"start": -3050, "end": -1850, "precision": "range"}, "location": {"name": "The river valleys of eastern North America", "lat": 38.0, "lng": -90.0, "region": "americas-north"}, "categories": ["agriculture", "biology"], "question": "What grows here, out of what already grows here?", "answer": "Sunflower, squash, marshelder and goosefoot, domesticated locally between about 5,000 and 3,800 years ago — independently of Mesoamerica.", "significance": "This is an independent centre of crop domestication in a region usually treated as having received agriculture rather than invented it, and sunflower is the case that pins it down. The part with no close parallel is what happened next: several of these crops fell out of cultivation around European colonisation, and their domesticated forms now exist only in the archaeological record. Knowledge here was not lost to collapse or forgetting but displaced by other crops, and the plants are described as potentially reawakable rather than gone.", "sources": [{"citation": "Mueller, N. G. (2025). The sleeping crops of eastern North America: a new synthesis. Philosophical Transactions of the Royal Society B, 380(1926), 20240192. DOI 10.1098/rstb.2024.0192.", "url": "https://doi.org/10.1098/rstb.2024.0192", "accessed": "2026-08-26", "supports": "Indigenous peoples in eastern North America domesticating a diverse group of annual crops; several falling out of cultivation around the time of European colonisation with domesticated forms known only from the archaeological record; the framing of these crops as potentially reawakable", "kind": "scholarly"}, {"citation": "Hart, J. P. (2025). The effects of charring on sunflower (Helianthus annuus L) achenes and kernels: Taphonomic and behavioral implications. PLoS One, 20(6), e0326159. DOI 10.1371/journal.pone.0326159.", "url": "https://doi.org/10.1371/journal.pone.0326159", "accessed": "2026-08-26", "supports": "sunflower as one of several seed-bearing annual plants domesticated in eastern North America 5,000-3,800 years ago", "kind": "scholarly"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "donkey-domestication", "title": "Donkeys carry loads while still looking like wild asses", "type": "discovery", "layer": "knowledge", "date": {"start": -3000, "end": -3000, "precision": "circa"}, "location": {"name": "Abydos, Middle Egypt", "lat": 26.18, "lng": 31.92, "region": "egypt-nile"}, "categories": ["agriculture", "biology", "transport"], "question": "How do you move more than a person can carry?", "answer": "Put it on an animal. The donkey, taken from the African wild ass, was doing that work before its skeleton had finished changing.", "significance": "Animals were doing the work of domesticates while their skeletons still looked substantially wild. Ten roughly 5,000-year-old ass skeletons from a pharaonic mortuary complex at Abydos, measured against 53 modern donkey and African wild ass skeletons, fell between the two, and every one carried osteopathologies consistent with load carrying. That led the authors to read domestication as slower and less linear than it had been assumed to be.", "sources": [{"citation": "Rossel, S., Marshall, F., Peters, J., Pilgram, T., Adams, M. D., & O'Connor, D. (2008). Domestication of the donkey: timing, processes, and indicators. Proceedings of the National Academy of Sciences, 105(10), 3715-3720. DOI 10.1073/pnas.0709692105.", "url": "https://doi.org/10.1073/pnas.0709692105", "accessed": "2026-08-24", "supports": "an African origin for the donkey from the African wild ass; the difficulty of dating domestication because donkeys are uncommon archaeologically and early markers are hard to determine; 10 c. 5,000-year-old ass skeletons from an early pharaonic mortuary complex at Abydos, Middle Egypt; comparison against 53 modern donkey and African wild ass skeletons; metacarpal proportions and midshaft breadths resembling wild ass with midshaft depths and distal breadths intermediate; osteopathologies consistent with load carrying on all Abydos skeletons; the conclusion that domestication is slower and less linear than previously thought", "kind": "scholarly"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "label": "The donkey", "change": "Loads travel further than a person can carry them.", "era": "trunk"}, {"id": "lexical-lists", "title": "Knowledge is put in order: the Mesopotamian lexical lists", "type": "work", "layer": "knowledge", "date": {"start": -3000, "end": -1600, "precision": "range"}, "location": {"name": "Shuruppak and Abu Salabikh, southern Mesopotamia", "lat": 31.78, "lng": 45.51, "region": "mesopotamia"}, "branch": "trunk", "categories": ["writing", "language", "knowledge-organisation"], "question": "What, of everything a scribe now has to know, is worth setting down in a fixed order, and what should that order be?", "question_status": "reconstructed", "answer": "Ordered lists of words grouped by kind — professions, gods, body parts, animals, plants, diseases, vessels, temples — copied and recopied as the core of a scribe's training.", "significance": "A domain could be set down as a structure rather than recorded as a transaction, and a structure can be argued with. Professions in fixed order assert a social order and grouped animals or diseases assert boundaries between categories, centuries before anyone argued for one in prose. That the professions list LU A was copied virtually unchanged for a thousand years makes it a transmitted canon rather than a working document.", "links": {"builds_on": ["proto-cuneiform-accounting"], "leads_to": ["edubba-scribal-school"]}, "sources": [{"citation": "\"Lexical lists\", Wikipedia.", "url": "https://en.wikipedia.org/wiki/Lexical_lists", "accessed": "2026-08-24", "supports": "date range and earliest attestation, Fara and Abu Salabikh c. 2600 BCE, thematic/acrographic/sign-based organisation, the categories covered, LU A reproduced unchanged for a thousand years, Urra=hubullu at ~9,700 entries on 24 tablets", "kind": "tertiary"}, {"citation": "\"Eduba\", Wikipedia.", "url": "https://en.wikipedia.org/wiki/Eduba", "accessed": "2026-08-24", "supports": "lexical lists as the core of the elementary scribal curriculum, and their survival as school copies", "kind": "tertiary"}], "verification": "unverified", "tier": 1, "label": "Word lists", "change": "Knowledge set out as a structure instead of recorded as an event.", "era": "trunk"}, {"id": "inscribed-baked-brick", "label": "Inscribed brick", "change": "A standard building unit that also carries the name of who laid it.", "title": "Mesopotamia builds in baked brick and signs the bricks", "type": "invention", "layer": "knowledge", "date": {"start": -3000, "end": -1000, "precision": "range"}, "location": {"name": "Southern Mesopotamia", "lat": 32.0, "lng": 45.5, "region": "mesopotamia"}, "categories": ["technology", "materials", "administration"], "question": "How do you raise something tall out of a plain that has no stone?", "answer": "Make the stone. Baked mud brick, to a standard size, stamped with the king who ordered the work.", "significance": "A floodplain with no timber and no quarry gets its monumental architecture from a manufactured unit, and the standardisation is the technology rather than the mud. The stamped inscription turns each brick into a dated object, which is why 32 of them, tied to the reigns of twelve kings, could be used to build a high-resolution record of the earth's magnetic field across the third to first millennia BCE. A building material that is also an archive is an unusually direct case of a technology outliving its purpose.", "sources": [{"citation": "Howland, M. D., Tauxe, L., Gordin, S., Altaweel, M., Cych, B., & Ben-Yosef, E. (2023). Exploring geomagnetic variations in ancient Mesopotamia: Archaeomagnetic study of inscribed bricks from the 3rd-1st millennia BCE. Proceedings of the National Academy of Sciences, 120, e2313361120. DOI 10.1073/pnas.2313361120.", "url": "https://doi.org/10.1073/pnas.2313361120", "accessed": "2026-08-24", "supports": "32 inscribed baked bricks from Mesopotamia spanning the 3rd to the 1st millennia BCE, tightly dated to the reigns of 12 Mesopotamian kings through interpretation of their inscriptions; their use to build a high-resolution archaeointensity curve and to establish archaeomagnetism as an absolute dating technique", "kind": "scholarly"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "cuneiform-phonetization", "title": "Signs begin standing for sounds: cuneiform becomes able to write anything", "type": "invention", "layer": "knowledge", "date": {"start": -2800, "end": -1800, "precision": "range"}, "location": {"name": "Sumer and Akkad, southern Mesopotamia", "lat": 31.32, "lng": 45.64, "region": "mesopotamia"}, "branch": "trunk", "categories": ["writing", "language"], "question": "How can a script built to itemise commodities record a personal name, a grammatical ending, or a sentence in a language it was not designed for?", "question_status": "reconstructed", "answer": "Let a sign stand for the sound of the word it depicts rather than for the thing itself, so that any utterance can be spelled out syllable by syllable.", "significance": "Writing stopped being limited to what it could depict and became able to carry anything sayable. The sign inventory fell from roughly 1,500 to roughly 600, because a syllabary needs fewer symbols than a catalogue of things does. Cuneiform then carried languages unrelated to Sumerian - Akkadian from the 24th century BCE, Elamite by about 2200, Hittite from about 1800 - which makes it a technology rather than a local convention.", "links": {"builds_on": ["proto-cuneiform-accounting"], "leads_to": ["edubba-scribal-school"]}, "sources": [{"citation": "\"Cuneiform\", Wikipedia.", "url": "https://en.wikipedia.org/wiki/Cuneiform", "accessed": "2026-08-24", "supports": "phonetic syllabic use from c. 2800 BCE, the reduction from ~1500 to ~600 signs, Akkadian adoption from the 24th century, Elamite c. 2200, Hittite from c. 1800, the stylus and 90-degree rotation", "kind": "tertiary"}], "verification": "unverified", "tier": 1, "label": "Signs for sounds", "change": "Writing can now carry anything sayable, in any language.", "era": "trunk"}, {"id": "african-crop-domestication", "title": "African rice and pearl millet are domesticated from African wild species", "type": "invention", "layer": "knowledge", "date": {"start": -2800, "end": -1000, "precision": "range"}, "location": {"name": "The Niger river region and the western Sahel, West Africa", "lat": 13.5, "lng": 2.0, "region": "africa-sub-saharan"}, "categories": ["agriculture", "biology"], "question": "The Asian grains do not thrive here. What can be made to, out of what already grows on the Niger?", "answer": "African rice, Oryza glaberrima, domesticated in a single region along the Niger, and pearl millet in the western Sahel by about 2800 BCE.", "significance": "Rice was domesticated a second time, from a different wild species, on the Niger. Population genomics across 20 O. glaberrima and 94 wild O. barthii accessions supports one region of origin rather than scattered events, and the selection scan found artificial selection acting on genes orthologous to those already known from Asian rice, which establishes independence and convergence at once. Pearl millet traces to the western Sahel by about 2800 BCE and had reached the lower Indus by 2578 to 2358 BCE, contemporary with the oldest African evidence.", "sources": [{"citation": "Wang, M., Yu, Y., Haberer, G., Marri, P. R., Fan, C., Goicoechea, J. L., et al. (2014). The genome sequence of African rice (Oryza glaberrima) and evidence for independent domestication. Nature Genetics, 46(9), 982-988. DOI 10.1038/ng.3044.", "url": "https://doi.org/10.1038/ng.3044", "accessed": "2026-08-24", "supports": "African rice cultivation dating back more than 3,000 years; O. glaberrima being an entirely different species from O. sativa; population genomics of 20 O. glaberrima and 94 O. barthii accessions supporting domestication in a single region along the Niger river rather than noncentric events; genome-wide artificial selection and convergent yet independent selection on a common set of domestication genes orthologous to O. sativa", "kind": "scholarly"}, {"citation": "Jimenez-Arteaga, C., Parque, O., Lancelotti, C., Moderato, M., Veesar, G. M., Abro, T., Chandio, A., & Madella, M. (2025). New evidence reveals dispersal of pearl millet from West Africa to South Asia by 2500 BCE. Scientific Reports, 15, 32931. DOI 10.1038/s41598-025-20110-w.", "url": "https://doi.org/10.1038/s41598-025-20110-w", "accessed": "2026-08-24", "supports": "genetic studies tracing pearl millet domestication to the western Sahel by 2800 BCE; earliest domestication traits dated c. 2500 BCE in pottery temper; two caryopses from Bhando Qubo in the lower Indus valley directly dated to 2578-2358 and 2576-2356 cal BCE", "kind": "scholarly"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "manufactured", "label": "African rice", "change": "Rice domesticated a second time, from a different wild species.", "era": "trunk"}, {"id": "caral-monumental-urbanism", "label": "Caral", "change": "Monumental cities in the Americas, built before anyone there made pottery.", "title": "The Supe valley builds monumental cities without pottery", "type": "invention", "layer": "knowledge", "date": {"start": -2627, "end": -1977, "precision": "range"}, "location": {"name": "Caral, Supe valley, central coast of Peru", "lat": -10.89, "lng": -77.52, "region": "americas-andean"}, "categories": ["society", "architecture", "agriculture"], "question": "Can people be organised at the scale a monument needs, this early, here?", "answer": "Yes. Radiocarbon dates put monumental architecture, urban settlement and irrigation agriculture in the Supe valley from about 2627 to 1977 BC.", "significance": "Monumental corporate architecture, urban settlement and irrigation agriculture arrive together in the Americas at Caral, and they arrive without ceramics, which the usual sequence treats as a precondition for settled complexity. The site sits 23 kilometres inland from the Pacific and its central zone of monumental, residential and non-residential architecture covers 65 hectares, and it is one of eighteen large preceramic sites in the same valley. Eighteen is the number that matters: this is a regional system, not an outlier.", "sources": [{"citation": "Solis, R. S., Haas, J., & Creamer, W. (2001). Dating Caral, a preceramic site in the Supe Valley on the central coast of Peru. Science, 292, 723-726. DOI 10.1126/science.1059519.", "url": "https://doi.org/10.1126/science.1059519", "accessed": "2026-08-24", "supports": "radiocarbon dates placing monumental corporate architecture, urban settlement and irrigation agriculture in the Americas from 4090 BP (2627 cal BC) to 3640 BP (1977 cal BC); the site 23 km inland; a central zone of monumental, residential and non-residential architecture covering 65 hectares; Caral as one of 18 large preceramic sites in the Supe Valley", "kind": "scholarly"}], "verification": "unverified", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "manufactured", "era": "trunk"}, {"id": "saqqara-hydraulics", "label": "Water as a lift", "change": "Water may have raised the stones, not just floated them there.", "title": "Egypt's first pyramid may have been built with a hydraulic lift", "type": "invention", "layer": "knowledge", "date": {"start": -2600, "end": -2500, "precision": "circa"}, "location": {"name": "Saqqara, Lower Egypt", "lat": 29.87, "lng": 31.22, "region": "egypt-nile"}, "branch": "trunk", "categories": ["engineering", "technology"], "question": "How do you lift a stone higher than any ramp you can afford to build?", "question_status": "reconstructed", "answer": "Possibly with water: a dam to trap and settle it, a treatment channel to clean it, and a shaft up the pyramid's centre.", "significance": "Egyptian mastery of water is not in doubt - canals for irrigation and barges for moving stone are well established - and the proposal here is that the same force was turned upward. Mapping of the watersheds reads the Gisr el-Mudir enclosure as a check dam trapping sediment and water, the Dry Moat's southern section as a settling, retention and purification system, and the Step Pyramid's internal architecture as consistent with a hydraulic elevation mechanism raising stones from the centre. This is a 2024 proposal rather than a settled account, it is marked contested for that reason, and it is included because what it argues about is the engineering rather than the tomb.", "links": {"builds_on": [], "leads_to": []}, "sources": [{"citation": "Landreau, X., Piton, G., Morin, G., Bartout, P., Touchart, L., Giraud, C., Barre, J. C., Guerin, C., Alibert, A., & Lallemand, C. (2024). On the possible use of hydraulic force to assist with building the step pyramid of Saqqara. PLoS One, 19, e0306690. DOI 10.1371/journal.pone.0306690.", "url": "https://doi.org/10.1371/journal.pone.0306690", "accessed": "2026-08-24", "supports": "the Step Pyramid of Djoser as the oldest of the monumental pyramids, built about 4,500 years ago; the Gisr el-Mudir enclosure read as a check dam; the Dry Moat's southern section as a settling, retention and purification system; the internal architecture read as consistent with a previously unreported hydraulic elevation mechanism; established Egyptian mastery of canals for irrigation and barges for transporting stone", "kind": "scholarly"}], "verification": "contested", "tier": 2, "era": "trunk"}, {"id": "indus-script", "label": "Indus script", "change": "A writing system nobody can read, still argued over as writing at all.", "title": "The Indus civilisation leaves a script that has never been read", "type": "invention", "layer": "knowledge", "date": {"start": -2600, "end": -1900, "precision": "range"}, "location": {"name": "The Indus valley, present-day Pakistan and north-west India", "lat": 27.32, "lng": 68.14, "region": "south-asia"}, "categories": ["writing", "language"], "question": "How do you mark, on a sealed thing, whose it is and what is inside?", "answer": "A repertoire of signs impressed on seals and tablets, in use for seven centuries and unread ever since.", "significance": "A literate-looking civilisation the size of Mesopotamia and Egypt is, so far, silent: nothing written by the Indus can be read, so everything known about it is inferred from objects. Whether the signs encode a language at all has been challenged, and a statistical argument that the script's conditional entropy sits closer to natural languages than to non-linguistic sign systems drew a published rebuttal and a published reply. What that argument settles is not the reading but the question, which stays open.", "sources": [{"citation": "Rao, R. P. N., Yadav, N., Vahia, M. N., Joglekar, H., Adhikari, R., & Mahadevan, I. (2009). Entropic evidence for linguistic structure in the Indus script. Science, 324, 1165. DOI 10.1126/science.1170391.", "url": "https://doi.org/10.1126/science.1170391", "accessed": "2026-08-24", "supports": "the script remaining undeciphered; the hypothesis that it encodes language having recently been questioned; the finding that its conditional entropy is closer to natural languages than to various non-linguistic systems", "kind": "scholarly"}, {"citation": "Rao, R. P. N., Yadav, N., Vahia, M. N., Joglekar, H., Adhikari, R., & Mahadevan, I. (2010). Entropy, the Indus Script, and Language: A Reply to R. Sproat. Computational Linguistics, 36(4), 795-805. DOI 10.1162/coli_c_00030.", "url": "https://doi.org/10.1162/coli_c_00030", "accessed": "2026-08-24", "supports": "the existence of a published dispute: Richard Sproat challenged the entropy argument and the original authors replied in a peer-reviewed venue. Cited for the fact that the question is contested, not for either side winning", "kind": "scholarly"}, {"citation": "Suryanarayan, A., Cubas, M., Craig, O. E., Heron, C. P., Shinde, V. S., Singh, R. N., O'Connell, T. C., & Petrie, C. A. (2021). Lipid residues in pottery from the Indus Civilisation in northwest India. Journal of Archaeological Science, 125, 105291. DOI 10.1016/j.jas.2020.105291.", "url": "https://doi.org/10.1016/j.jas.2020.105291", "accessed": "2026-08-24", "supports": "the Mature Harappan period dated to circa 2600/2500-1900 BC; urban and rural populations processing similar products, with limited evidence of change from the urban to the post-urban period", "kind": "scholarly"}], "verification": "contested", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "indus-standard-weights", "label": "Indus weights", "change": "Cubes of stone in fixed ratios, the same across a thousand kilometres.", "title": "The Indus agrees a weight and holds it across its whole range", "type": "invention", "layer": "knowledge", "date": {"start": -2600, "end": -1900, "precision": "range"}, "location": {"name": "Harappa and Mohenjo-daro, the Indus valley", "lat": 27.32, "lng": 68.14, "region": "south-asia"}, "categories": ["mathematics", "administration"], "question": "How do two towns a month apart agree what they are trading?", "answer": "By using the same weights. Cubical chert weights in a fixed binary-then-decimal series turn up across the whole Indus range, made to the same standard.", "significance": "Mesopotamia's units were unified by royal decree and named after a king; the Indus weights are consistent across an area larger than Mesopotamia and Egypt combined with no comparable evidence of a ruler imposing them, which is a different kind of achievement and a harder one to explain. The series is regular enough to be checked, and its persistence over centuries is what makes it a standard rather than a habit.", "sources": [{"citation": "\"Indus Valley Civilisation\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/Indus_Valley_Civilisation", "accessed": "2026-08-25", "supports": "the Mature Harappan period c. 2600-1900 BCE; standardised cubical stone weights in a regular series used across the Indus range; the absence of clear evidence for a centralised ruler comparable to Mesopotamian or Egyptian kingship", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "first-glass", "label": "Glass", "change": "A material with no grain, no crystal and no natural form, made on purpose.", "title": "Mesopotamia and Egypt make a solid that was never a crystal", "type": "invention", "layer": "knowledge", "date": {"start": -2500, "end": -2000, "precision": "range"}, "location": {"name": "Syria, Mesopotamia or Egypt; a glass lump is known from Eridu", "lat": 30.8, "lng": 46.1, "region": "mesopotamia"}, "categories": ["technology", "materials"], "question": "What else will the furnace do, if it will melt copper out of rock?", "answer": "Melt sand with plant ash until it runs, and let it cool without ever setting into a crystal.", "significance": "Glass does not exist in usable form in nature and has to be made, and it is stranger than smelted metal because it never becomes a crystal — it is cooled from a melt into a solid that keeps the disordered structure of a liquid. Getting there needs soda ash, obtainable from the ashes of salt-tolerant seashore plants, which means the recipe includes a plant chosen for what burning it leaves behind. The earliest objects are beads from the mid-third millennium BCE and may be accidental by-products of metal or faience working, with a glass lump from Eridu dated to the twenty-first century BCE or earlier.", "sources": [{"citation": "\"History of glass\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/History_of_glass", "accessed": "2026-09-18", "supports": "the earliest known glass objects as beads of the mid-third millennium BCE, perhaps accidental by-products; first true glass emerging in Syria, Mesopotamia or Egypt; a glass lump from Eridu datable to the twenty-first century BCE or earlier; faience as a pre-glass vitreous material made by a process similar to glazing; soda ash extracted from the ashes of halophile seashore plants; core-formed vessels made by winding a ductile rope of glass around a sand-and-clay core", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "minoan-crete", "label": "Minoan Crete", "change": "Europe's first palace society, grown where it stood rather than imported.", "title": "Crete grows a palace society out of its own villages", "type": "discovery", "layer": "knowledge", "date": {"start": -2450, "end": -1750, "precision": "range"}, "location": {"name": "Crete, in the Aegean", "lat": 35.3, "lng": 24.9, "region": "mediterranean"}, "categories": ["society"], "question": "How do you run an island that has outgrown the village?", "answer": "From the island it stands on. Mitochondrial DNA from Minoan remains points to descent from the Neolithic settlers of Crete, not to arrival from North Africa.", "significance": "The Minoans were long explained by import — an Egyptian or North African founding population bringing civilisation to a European island — and analysis of mitochondrial DNA from Minoan skeletal remains of 4,400 to 3,700 years before present refutes that, showing the strongest relationships with Neolithic and modern European populations. What that leaves is a palace society, a script, and long-distance seafaring developing in place. The pattern repeats what the megalith genetics showed in western Europe: complexity arriving without a population arriving with it.", "sources": [{"citation": "Hughey, J. R., Paschou, P., Drineas, P., et al. (2013). A European population in Minoan Bronze Age Crete. Nature Communications, 4, 1861. DOI 10.1038/ncomms2871.", "url": "https://doi.org/10.1038/ncomms2871", "accessed": "2026-08-25", "supports": "mitochondrial DNA analysis of Minoan skeletal remains from Crete dated 4,400-3,700 years BP; refutation of a North African origin; strongest relationships with Neolithic and modern European populations; support for autochthonous development of Minoan civilisation from Neolithic settlers", "kind": "scholarly"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "manufactured", "era": "trunk"}, {"id": "seeder-plough", "label": "The seeder plough", "change": "Cutting the furrow and sowing it in one pass, down a funnel.", "title": "Mesopotamia bolts a seed funnel onto the plough", "type": "invention", "layer": "knowledge", "date": {"start": -2300, "end": -1500, "precision": "range"}, "location": {"name": "Southern Mesopotamia", "lat": 32.0, "lng": 45.5, "region": "mesopotamia"}, "categories": ["agriculture", "technology"], "question": "Why walk the field twice?", "answer": "Add a funnel behind the share so the seed drops into the furrow as it is cut, at the depth and spacing you choose.", "significance": "Broadcasting seed by hand wastes most of it to birds and to landing badly; dropping it down a tube into a fresh furrow puts each seed at a chosen depth, which is the difference between scattering and planting. The base tool is the ard, a light symmetrical plough that scratches a furrow without turning the soil over, in use in the Near East from the sixth millennium BC, with iron versions appearing around 2300 BC in Assyria and third-dynasty Egypt. The seed-drill variant is specifically Mesopotamian, and it is the earliest known mechanised sowing.", "sources": [{"citation": "\"Ard (plough)\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/Ard_(plough)", "accessed": "2026-08-25", "supports": "the ard as a light plough without a mouldboard, tracing a shallow furrow without inverting the soil and symmetrical about its line of draft; evidence in the Near East from the 6th millennium BC; iron versions c. 2300 BC in Assyria and 3rd-dynasty Egypt; the seed-drill ard used specifically in Mesopotamia, adding a funnel to drop seed into the furrow as the ard cuts it", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "horse-and-chariot", "label": "The horse", "change": "A rideable, drivable animal, and the distances a person can cover collapse.", "title": "The modern horse comes out of the lower Volga, with the chariot behind it", "type": "invention", "layer": "knowledge", "date": {"start": -2200, "end": -1800, "precision": "range"}, "location": {"name": "The lower Volga-Don region, the Western Eurasian steppe", "lat": 48.7, "lng": 44.5, "region": "europe-north-east"}, "categories": ["technology", "biology", "transport"], "question": "How far can a person get in a day?", "answer": "Much further, once the horse is bred for it. Modern domestic horses trace to the lower Volga-Don and spread across Eurasia from about 2000 BC.", "significance": "273 ancient genomes place the homeland of modern domestic horses in the Western Eurasian steppes and show them replacing almost all other local horse populations as they expanded from about 2000 BC, moving in step with equestrian material culture including Sintashta spoke-wheeled chariots. The animal was bred for the job: strong selection appears at GSDMC and ZFPM1, genes tied to locomotion and behaviour, so this is a technology built out of an organism. The same evidence rejects a story widely told, that horseback riding carried Yamnaya pastoralists and Indo-European languages into Europe around 3000 BC; the horses were not yet there to do it.", "sources": [{"citation": "Librado, P., Khan, N., Fages, A., et al. (2021). The origins and spread of domestic horses from the Western Eurasian steppes. Nature, 598, 634-640. DOI 10.1038/s41586-021-04018-9.", "url": "https://doi.org/10.1038/s41586-021-04018-9", "accessed": "2026-08-26", "supports": "modern domesticated breeds not descending from the Botai lineage of c. 3500 BC; the lower Volga-Don region as the homeland of modern domestic horses; 273 ancient horse genomes; rapid expansion across Eurasia from about 2000 BC replacing local populations, synchronous with Sintashta spoke-wheeled chariots; selection at GSDMC and ZFPM1 for locomotor and behavioural adaptations; rejection of the horseback-riding explanation for the Yamnaya expansion into Europe around 3000 BC", "kind": "scholarly"}], "verification": "unverified", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "standardised-measure", "label": "Standard measures", "change": "One agreed unit, so a stranger's count can be checked against yours.", "title": "Mesopotamia agrees what a shekel is", "type": "invention", "layer": "knowledge", "date": {"start": -2150, "end": -2000, "precision": "circa"}, "location": {"name": "Akkad and Lagash, Mesopotamia", "lat": 32.0, "lng": 45.5, "region": "mesopotamia"}, "categories": ["mathematics", "administration"], "question": "Whose bushel is a bushel?", "answer": "The king's. Around 2150 BCE a royal standard unified competing systems, and the units run in sixties: sixty shekels to a mina, sixty minas to a talent.", "significance": "Agreeing a unit means agreeing to be measured against somebody else's copy of it, which is a political act before it is a technical one — and it is what lets a contract, a tax and a debt mean the same thing in two towns. The system is built on the same base sixty as the number notation, so weight, length and capacity all divide the way the arithmetic already does: a shekel of about 8.4 grams, a mina of sixty of them, a talent of sixty minas. The royal gur-cube introduced under Naram-Sin is described as the first standardised system of measure in Mesopotamia, and it was still being invoked by Gudea around 2000 BCE.", "sources": [{"citation": "\"Ancient Mesopotamian units of measurement\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/Ancient_Mesopotamian_units_of_measurement", "accessed": "2026-08-25", "supports": "the shekel at 8.40 plus or minus 0.34 g, the mina at 60 shekels and about 504 g, the talent at 3,600 shekels and about 30.2 kg; the grain at 1/180 shekel; length in cubits with finger, foot, step, reed, rod and cord subdivisions; capacity in sila, ban, barig and gur-cube; the royal gur-cube under Naram-Sin c. 2150 BCE described as the first standardised system of measure in Mesopotamia; the Letter of Nanshe issued by Gudea c. 2000 BCE confirming its continued use; Old Babylonian weights made from haematite", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "sexagesimal-place-value", "title": "Position starts carrying magnitude: the sexagesimal place-value system", "type": "invention", "layer": "knowledge", "date": {"start": -2100, "end": -2000, "precision": "disputed"}, "location": {"name": "Ur and southern Mesopotamia, Third Dynasty of Ur", "lat": 30.96, "lng": 46.1, "region": "mesopotamia"}, "branch": "trunk", "categories": ["mathematics"], "question": "How can one small set of number signs express any magnitude at all, so that calculating becomes a procedure to run rather than a fresh problem to solve?", "question_status": "reconstructed", "answer": "Let a sign's position determine which power of sixty it counts, so that the same handful of symbols spans every scale and arithmetic reduces to steps that can be tabulated.", "significance": "Number came loose from the thing counted, so one procedure could serve every subject. That is the exact reversal of proto-cuneiform's thirteen commodity-bound notations. Division was done as multiplication by a reciprocal, so a table of reciprocals turned an open-ended operation into a lookup - and because reciprocals terminate only for regular numbers, which numbers were convenient became a property of the notation rather than of the problem.", "links": {"builds_on": [], "leads_to": ["ob-quadratic-procedures", "plimpton-322"]}, "sources": [{"citation": "Friberg, J. (2005). On the Alleged Counting with Sexagesimal Place Value Numbers in Mathematical Cuneiform Texts from the Third Millennium B.C. Cuneiform Digital Library Journal 2005:2.", "url": "https://cdli.earth/articles/cdlj/2005-2", "accessed": "2026-08-24", "supports": "the disputed date: earliest confirmed use in YOS 4, 293, an Ur III scratch pad c. 2100-2000 BCE, and the argument against earlier third-millennium use", "kind": "scholarly"}, {"citation": "\"Babylonian mathematics\", Wikipedia.", "url": "https://en.wikipedia.org/wiki/Babylonian_mathematics", "accessed": "2026-08-24", "supports": "division performed as multiplication by a reciprocal, reciprocal and multiplication tables, regular numbers terminating and others requiring approximation", "kind": "tertiary"}], "verification": "contested", "tier": 1, "label": "Place value", "change": "Position carries size, so arithmetic becomes a procedure you run.", "era": "trunk"}, {"id": "gilgamesh", "label": "Gilgamesh", "change": "Death set down as a problem to think about, not just a thing that happens.", "title": "A poem makes mortality into a question that can be argued with", "type": "work", "layer": "knowledge", "date": {"start": -2100, "end": -1000, "precision": "range"}, "location": {"name": "Mesopotamia; the standard version compiled by Sin-leqi-unninni", "lat": 32.5, "lng": 44.4, "region": "mesopotamia"}, "categories": ["literature", "philosophy"], "question": "Everyone dies. Is there anything to be done about it, and if not, what then?", "answer": "Nothing is to be done. The poem's answer is that death was assigned to people when they were made, and the search for a way out is the part that fails.", "significance": "Before a text like this, mortality is a fact each person meets alone; after it, it is a stated problem with a stated answer that a reader can inherit, disagree with and argue against. The answer the poem gives is a refusal, told through a tavern-keeper: the unending life being searched for cannot be found, because death was set for people when they were made. Sumerian poems about Gilgamesh date from around 2100 BCE and the standard twelve-tablet version was compiled between 1300 and 1000 BCE by Sin-leqi-unninni, the earliest surviving narrative literature.", "sources": [{"citation": "\"Epic of Gilgamesh\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/Epic_of_Gilgamesh", "accessed": "2026-09-21", "supports": "earliest Sumerian poems c. 2100 BCE in the Third Dynasty of Ur; the Standard Babylonian version compiled between 1300 and 1000 BCE by Sin-leqi-unninni on twelve tablets; the quoted answer of Utnapishtim that life sought will never be found because the gods let death be man's share; recovery of about two-thirds of the text from the Library of Ashurbanipal; its description as the world's oldest surviving example of narrative literature", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "edubba-scribal-school", "title": "The house where tablets are handed out: scribal training in Old Babylonian Mesopotamia", "type": "scaffold-event", "layer": "knowledge", "date": {"start": -2000, "end": -1600, "precision": "range"}, "location": {"name": "Nippur, House F, southern Mesopotamia", "lat": 32.13, "lng": 45.23, "region": "mesopotamia"}, "branch": "trunk", "categories": [], "question": null, "question_status": "n/a", "answer": null, "significance": "The lexical lists are inexplicable without the school: it does not explain where they came from, since they are centuries older, but it explains why they persisted unchanged. House F at Nippur alone yielded nearly 1,500 tablet fragments, most of them student exercises, and the tablet types record the teaching directly - teacher's model beside pupil's copy, extract tablets, practice lentils. What the eduba actually was is contested: the archaeology points to teaching in private houses, the literature describes a formal institution.", "links": {"builds_on": ["cuneiform-phonetization", "lexical-lists"], "leads_to": []}, "sources": [{"citation": "\"Eduba\", Wikipedia.", "url": "https://en.wikipedia.org/wiki/Eduba", "accessed": "2026-08-24", "supports": "date range, House F at Nippur and its ~1,500 fragments, the four elementary curriculum stages, the tablet typology, and the formal-institution versus household-instruction dispute", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "label": "Scribal schools", "change": "Why the word lists and the mathematics survived unchanged for centuries.", "era": "trunk"}, {"id": "proto-sinaitic-alphabet", "label": "The alphabet", "change": "Two dozen signs replace several hundred, and writing escapes the scribes.", "title": "A handful of signs, one per sound, and writing stops needing a profession", "type": "invention", "layer": "knowledge", "date": {"start": -1850, "end": -1550, "precision": "disputed"}, "location": {"name": "Serabit el-Khadim, Sinai, and Wadi el-Hol, Middle Egypt", "lat": 29.04, "lng": 33.46, "region": "levant-anatolia"}, "categories": ["writing", "language"], "question": "Why should writing take years to learn?", "answer": "Take an Egyptian sign, keep only the first sound of the Semitic word for what it shows, and throw away everything else.", "significance": "This is the largest compression in the history of writing and the acrophonic trick is the whole of it: the hieroglyph for house, Egyptian pr, is kept for Semitic /b/ because the Semitic word is baytu. Several hundred signs collapse to a couple of dozen, which turns literacy from a scribal profession into something learnable in weeks, and the alphabets that carry most of the world's writing descend through it — Paleo-Hebrew, Ancient South Arabian and Phoenician, and from Phoenician the Greek and Latin. Not all of them do: Hangul was designed from scratch in the fifteenth century. The date is genuinely open between about 1850 and about 1550 BC, and the argument matters because it decides whether the alphabet was invented in Egypt or in Canaan.", "sources": [{"citation": "\"Proto-Sinaitic script\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/Proto-Sinaitic_script", "accessed": "2026-08-25", "supports": "the Serabit el-Khadim inscriptions found by Flinders and Hilda Petrie in 1904-1905; the Wadi el-Hol inscriptions found by John and Deborah Darnell in 1999 and dated 1900-1800 BC; the acrophonic principle and the pr/baytu example; descent to the Paleo-Hebrew, Ancient South Arabian and Phoenician alphabets and thence to Greek and Latin; the open dispute between an early date c. 1850 BC and a late date c. 1550 BC, and what it decides about Egypt versus Canaan; Gardiner's 1916 interpretation as foundational", "kind": "tertiary"}], "verification": "unverified", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "ob-quadratic-procedures", "title": "A whole class of problem gets a recipe: Old Babylonian quadratic procedures", "type": "work", "layer": "knowledge", "date": {"start": -1830, "end": -1531, "precision": "range"}, "location": {"name": "Southern Mesopotamia, precise provenance not established by the cited source", "lat": 31.6, "lng": 45.7, "region": "mesopotamia"}, "branch": "trunk", "categories": ["mathematics"], "question": "Given the area of a rectangle and the amount by which its length exceeds its width, what are its sides?", "question_status": "attested", "answer": "A fixed sequence of arithmetical steps that returns the sides — the procedure later written as the quadratic formula — carried out entirely without algebraic notation.", "significance": "A whole class of problem could be solved by running a fixed sequence, rather than solved once. There is no symbolic notation here, so whatever generality the method has lives in the order of the operations and in the worked example carrying it. The tablets record the procedure and the outcome; whether Old Babylonian mathematics also argued that its procedures must work is not something they say.", "links": {"builds_on": ["sexagesimal-place-value"], "leads_to": []}, "sources": [{"citation": "\"Babylonian mathematics\", Wikipedia.", "url": "https://en.wikipedia.org/wiki/Babylonian_mathematics", "accessed": "2026-08-24", "supports": "the rectangle problem type, solution of x^2 + bx = c by the standard quadratic procedure, the absence of algebraic notation, reliance on precalculated tables, and the Old Babylonian dating", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "label": "Quadratic method", "change": "Solve every problem of a shape by following fixed steps.", "era": "trunk"}, {"id": "plimpton-322", "title": "A teacher's table of exact right triangles: Plimpton 322", "type": "work", "layer": "knowledge", "date": {"start": -1822, "end": -1784, "precision": "range"}, "location": {"name": "Larsa (Senkereh), southern Mesopotamia", "lat": 31.28, "lng": 45.85, "region": "mesopotamia"}, "branch": "trunk", "categories": ["mathematics"], "question": "How do you produce right triangles whose sides come out exactly in base sixty, so that a set exercise resolves cleanly instead of running on forever?", "question_status": "reconstructed", "answer": "Fifteen rows of Pythagorean triples in which the long leg is always a regular number, divisible by no prime beyond two, three and five, so that every ratio in the table terminates.", "significance": "The tablet is evidence about mathematical practice rather than about theory, because its triples were chosen so the arithmetic terminates - a teaching requirement, not a number-theoretic one. Nothing in number theory requires the long leg to be a regular number; base-sixty arithmetic that must come out clean does. What it was for remains contested: generating pairs, reciprocal pairs and a teacher's aid, or a trigonometric reading its critics call anachronistic because angle measure is absent from the record.", "links": {"builds_on": ["sexagesimal-place-value"], "leads_to": []}, "sources": [{"citation": "\"Plimpton 322\", Wikipedia. An encyclopedia entry. It reports Neugebauer & Sachs (1945) and Robson (2001, 2002); those works are not cited here directly.", "url": "https://en.wikipedia.org/wiki/Plimpton_322", "accessed": "2026-08-24", "supports": "dating to c. 1822-1784 BCE and the Larsa provenance, the four columns and fifteen rows, the regular-number constraint on the long leg, the Neugebauer-Sachs generating-pair reading and its criticisms, Robson's reciprocal-pair and teacher's-aid reading, the rejection of the trigonometric reading as anachronistic, and the six agreed errors", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "label": "Plimpton 322", "change": "A teacher's worksheet. Evidence of how mathematics was taught.", "era": "trunk"}, {"id": "pacific-voyaging", "label": "Ocean voyaging", "change": "Deliberate crossings of open ocean to islands nobody had seen.", "title": "The Pacific is settled on purpose, across water with no land in sight", "type": "invention", "layer": "knowledge", "date": {"start": -1750, "end": -1000, "precision": "range"}, "location": {"name": "From near Oceania into Remote Oceania, the western Pacific", "lat": -8.0, "lng": 159.0, "region": "oceania"}, "categories": ["navigation", "technology"], "question": "How do you find an island you have never seen and cannot see from anywhere you have been?", "answer": "Sail for it deliberately, with craft and technique good enough that the crossing is repeatable rather than lucky.", "significance": "Settling Remote Oceania meant crossing water so wide that no landfall is visible for the whole passage, and doing it well enough to arrive, survive and do it again — the last and most extensive human movement into places nobody had ever lived. Mitogenome analysis of 1,364 sequences from 68 islands puts the settlement at about 3.2 thousand years ago, matching the radiocarbon dates, and names technological advances in sailing among the things that triggered the Lapita expansion out of New Guinea. Later voyages out of the tropics were harder still: simulation of Tahiti to New Zealand passages shows markedly harsher conditions and far greater thermoregulatory demand than the Hawaii route.", "sources": [{"citation": "Almeida, M., Gandini, F., Rito, T., Foody, M. G., Brandao, A., Oliveira, M., et al. (2025). Leveraging known Pacific colonisation times to test models for the ancestry of Southeast Asians. Scientific Reports, 15, 37044. DOI 10.1038/s41598-025-20856-3.", "url": "https://doi.org/10.1038/s41598-025-20856-3", "accessed": "2026-08-25", "supports": "analysis of 1,364 B4a1a1 mitogenomes from 68 islands; settlement of Remote Oceania estimated at ~3.2 ka, matching radiocarbon ages; B4a1a1a arising around the northern coasts of New Guinea at least 6 ka; technological advances in sailing named among the triggers of the Lapita expansion into Remote Oceania", "kind": "scholarly"}, {"citation": "Montenegro, A., Niclou, A., Anderson, A., Fitzpatrick, S. M., & Ocobock, C. (2023). Estimated energetic demands of thermoregulation during ancient canoe passages from Tahiti to Hawaii and New Zealand, a simulation analysis. PLoS One, 18, e0287290. DOI 10.1371/journal.pone.0287290.", "url": "https://doi.org/10.1371/journal.pone.0287290", "accessed": "2026-08-25", "supports": "prehistoric colonisation of East Polynesia as the last and most extensive human migration into previously uninhabited regions; simulated voyages from Tahiti to New Zealand and to Hawaii; markedly harsher conditions and significantly greater in-trip thermoregulatory demand on the New Zealand route", "kind": "scholarly"}], "verification": "unverified", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "edwin-smith-papyrus", "label": "Edwin Smith papyrus", "change": "Forty-eight injuries examined, diagnosed, and sorted by whether they can be treated.", "title": "An Egyptian surgical text separates what can be treated from what cannot", "type": "work", "layer": "knowledge", "date": {"start": -1600, "end": -1600, "precision": "circa"}, "location": {"name": "Egypt; the surviving copy is of a considerably older text", "lat": 25.7, "lng": 32.64, "region": "egypt-nile"}, "categories": ["medicine"], "question": "Which of these injuries is worth treating, and which will kill the patient whatever I do?", "answer": "Examine, decide, and say so: an ailment I will treat, an ailment I will contend with, or an ailment not to be treated.", "significance": "This is triage written down: forty-eight cases, each moving from title to examination to diagnosis to one of three verdicts, and only then to treatment. Admitting in writing that a case is not to be treated is the part that matters, because it makes prognosis a separate judgement from cure and puts a limit on what the practitioner claims. The text avoids prescribing magic almost throughout, which sets it apart from the Egyptian medical papyri that lean on it heavily.", "sources": [{"citation": "Khalpey, Z., Amer, H., & Abraham, A. (2026). Decoding the Past, Informing the Future: Artificial Intelligence as a Bridge Between Ancient Egyptian Medical Knowledge and Modern Surgical Practice. Cureus, 18, e104493. DOI 10.7759/cureus.104493.", "url": "https://doi.org/10.7759/cureus.104493", "accessed": "2026-08-24", "supports": "the Edwin Smith Papyrus offering a structured diagnostic framework based on observation and prognosis, in a case-based format distinguishing treatable, manageable and untreatable conditions; the contrast with the Ebers Papyrus and its pharmacology; Egyptian medicine as a hybrid of empirical observation and cosmology", "kind": "scholarly"}, {"citation": "Dukic, Z., & Stubicar, R. (2025). Bone fractures and their treatment in ancient Egypt based on the Edwin-Smith papyri. Acta Medico-Historica Adriatica, 23, 57-79. DOI 10.31952/amha.23.1.3.", "url": "https://doi.org/10.31952/amha.23.1.3", "accessed": "2026-08-24", "supports": "the Edwin Smith Papyrus as a principal source for ancient Egyptian medical science and the treatment of bone fractures; the entanglement of Egyptian medical procedure with religion and incantation", "kind": "scholarly"}, {"citation": "\"Edwin Smith Papyrus\", Wikipedia. An encyclopedia entry, cited only for the date and the case count alongside the peer-reviewed sources above, per D-013.3.", "url": "https://en.wikipedia.org/wiki/Edwin_Smith_Papyrus", "accessed": "2026-08-24", "supports": "the surviving copy dated c. 1600 BCE and believed to copy a considerably older text; 48 cases; the title-examination-diagnosis-treatment structure and the three verdicts quoted; the near-absence of magic relative to other Egyptian medical papyri", "kind": "tertiary"}], "verification": "unverified", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "attested", "era": "trunk"}, {"id": "rhind-papyrus", "label": "Rhind papyrus", "change": "Ninety-one worked problems, and a way of writing every fraction as a sum of unit parts.", "title": "Egypt writes down its mathematics as worked problems", "type": "work", "layer": "knowledge", "date": {"start": -1550, "end": -1550, "precision": "circa"}, "location": {"name": "Thebes, Upper Egypt", "lat": 25.72, "lng": 32.61, "region": "egypt-nile"}, "categories": ["mathematics"], "question": "How much bread, how much grain, how big is the field, and how do you divide a thing that will not divide evenly?", "answer": "Ninety-one worked problems, and a fraction system in which every part is a unit fraction, tabulated in advance so the awkward cases are already solved.", "significance": "Egyptian arithmetic insists that a fraction has a numerator of one, which turns dividing two loaves among five people into a lookup rather than a calculation, and the papyrus carries the table that makes it work: 2/n for every odd n from 3 to 101, each as a sum of at most four unit fractions. Its geometry problems take a circle's area as 64/81 of its circumscribing square, which is an approximation of pi to within one percent arrived at without any concept of pi. Like the Babylonian tablets, it is a collection of procedures and answers rather than an argument, and the scribe Ahmose says he is copying something already old.", "sources": [{"citation": "\"Rhind Mathematical Papyrus\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/Rhind_Mathematical_Papyrus", "accessed": "2026-08-24", "supports": "the papyrus dated c. 1550 BC, copied by the scribe Ahmose from an older text of the reign of Amenemhat III; 91 problems across arithmetic, geometry and miscellany; the unit-fraction system and the 2/n table for odd n from 3 to 101 in at most four terms; the circle's area given as 64/81 of its circumscribing square, yielding pi approximately 3.1605, an error under one percent", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "nixtamalization", "label": "Nixtamalization", "change": "Cook maize in lime water and it stops starving the people who live on it.", "title": "Mesoamerica finds the chemistry that makes maize safe to live on", "type": "discovery", "layer": "knowledge", "date": {"start": -1500, "end": -1200, "precision": "range"}, "location": {"name": "The southern coast of Guatemala", "lat": 14.1, "lng": -90.8, "region": "americas-meso"}, "categories": ["agriculture", "medicine", "materials"], "question": "Why do people who eat almost nothing but maize sicken, when maize grows so well?", "answer": "Soak and cook the grain in lime water first. The maize is chemically changed, and the sickness does not come.", "significance": "A diet of untreated maize produces pellagra, because its niacin is locked up and its tryptophan is unavailable without processing — and steeping the grain in an alkali releases both, while the calcium from the lime binds into the protein and polysaccharide structure. Nobody involved knew about niacin, and what they understood of why it mattered is not recorded; the practice was kept for three thousand years regardless. The proof that this is knowledge and not habit is what happened when only the crop travelled: maize spread worldwide through colonialism and nixtamalization did not, and pellagra followed it into northern Italy and the southern United States.", "sources": [{"citation": "\"Nixtamalization\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/Nixtamalization", "accessed": "2026-09-18", "supports": "earliest evidence dated 1200-1500 BCE on the southern coast of Guatemala; treatment with limewater or aqueous alkali carbonates; hemicellulose dissolved, hulls loosened, starches gelatinised; calcium acting as a cross-linking agent; tryptophan made available and niacin deficiency prevented; maize spreading through colonialism without the process, and consequent pellagra in northern Italy and the southern United States", "kind": "tertiary"}, {"citation": "Glesener, H., Roberts, A. M. P., Tanveer, H., Abdollahzadeh, D., Seegmiller, E., Su, B., et al. (2026). Local nixtamalization processes reduce aflatoxin B1 concentration and shift metabolome in naturally contaminated maize. Journal of Agricultural and Food Chemistry, 74(17), 13978-13989. DOI 10.1021/acs.jafc.5c13174.", "url": "https://doi.org/10.1021/acs.jafc.5c13174", "accessed": "2026-09-18", "supports": "a controlled study of current rural Guatemalan nixtamalization practice on contaminated maize: aflatoxin B1 down 81 percent across nine conditions and 86 percent with extended steeping, and calcium content up 808 percent. Cited for what the process does chemically, not for its antiquity: a 2026 food-science paper, not archaeology", "kind": "scholarly"}], "verification": "unverified", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "manufactured", "era": "trunk"}, {"id": "rigveda-oral-transmission", "label": "The Rigveda", "change": "A long text kept word-perfect for a thousand years with nothing written down.", "title": "India builds a memory system that holds a text exactly, without writing", "type": "work", "layer": "knowledge", "date": {"start": -1500, "end": -1000, "precision": "disputed"}, "location": {"name": "The north-western Indian subcontinent", "lat": 30.0, "lng": 74.0, "region": "south-asia"}, "categories": ["language", "knowledge-organisation"], "question": "How do you keep a long text exactly, for centuries, if it is never written down?", "answer": "Learn it in more than one form - every word alone in its pausal shape, and the words run together under the sound rules - and hand it on that way.", "significance": "This is a long text held word-for-word in human memory, with nothing written. It is learned in a padapatha, every word isolated in its pausal form, and in a samhitapatha, the words joined under sandhi, with structured enunciation that breaks compounds into stems and inflections. Ten books, 1,028 hymns and some 10,552 verses were carried this way with what scholars describe as unparalleled fidelity for more than a millennium before being written, and the dates remain contentious.", "sources": [{"citation": "\"Rigveda\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/Rigveda", "accessed": "2026-09-18", "supports": "composition c. 1500-1000 BCE with a wider proposed range of c. 1900-1200 BCE and codification c. 1200-1000 BCE; the padapatha, ascribed to Shakalya and given no date on the page, and the samhitapatha used for recitation; the page does NOT state that the two forms check each other, so no error-correcting mechanism is claimed here; structured enunciation breaking Sanskrit compounds into stems and inflections; 10 mandalas, 1,028 suktas and about 10,552 mantras in the Shakala recension; scholars' description of unparalleled fidelity over more than a millennium of oral transmission, and their note that the dates remain contentious", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "linear-b", "label": "Linear B", "change": "A script read 3,400 years later, and the language turned out to be Greek.", "title": "Europe's oldest readable writing is a palace inventory", "type": "invention", "layer": "knowledge", "date": {"start": -1450, "end": -1200, "precision": "range"}, "location": {"name": "Knossos on Crete, and Pylos, Mycenae, Thebes and Tiryns on the Greek mainland", "lat": 35.3, "lng": 25.16, "region": "mediterranean"}, "categories": ["writing", "language"], "question": "What is worth writing down, when writing is expensive and only a few can do it?", "answer": "Sheep, wool and grain. Around 87 syllabic signs plus more than a hundred ideograms, used almost entirely for palace accounts.", "significance": "This is the oldest writing in Europe that can be read, and what it says is inventory: wool, sheep, grain, allocations to religious groups, military matters — administration, the same use writing was first put to in Mesopotamia a millennium and a half earlier. The decipherment is the other half of the entry: Michael Ventris, building on Alice Kober's analysis, showed in 1952 that the language was Mycenaean Greek, five hundred years older than Homer. A script can outlive the ability to read it, and be recovered — which is why the Indus script's silence is a fact about evidence rather than a permanent condition.", "sources": [{"citation": "\"Linear B\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/Linear_B", "accessed": "2026-08-25", "supports": "use from c. 1450-1200 BC at Knossos, Pylos, Thebes, Mycenae and Tiryns; around 87 syllabic signs and over 100 ideographic signs; decipherment by Michael Ventris in 1952 building on Alice Kober's work, showing the language to be Mycenaean Greek five hundred years older than Homer; the tablets' almost entirely administrative content of wool, sheep, grain and military matters", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "mul-apin", "label": "MUL.APIN", "change": "The sky written down as a table: what rises, when, and how far apart.", "title": "Babylon compiles the sky into a reference book", "type": "work", "layer": "knowledge", "date": {"start": -1400, "end": -1000, "precision": "disputed"}, "location": {"name": "Babylonia", "lat": 32.5, "lng": 44.4, "region": "mesopotamia"}, "categories": ["astronomy", "knowledge-organisation"], "question": "The year drifts against the calendar. When exactly should the extra month go in?", "answer": "Watch which stars rise with the sun, and write the answer down as a rule anyone can follow.", "significance": "This is the sky converted from something you watch into something you look up: 66 stars and constellations sorted into three paths, heliacal rising dates for 34 stars and constellations, the intervals between risings, shadow lengths, water-clock settings, and rules for intercalation keyed to the Pleiades, Sirius and Arcturus — a calendar correction derived from observation rather than decree. The observational discipline is visible in the text itself: heliacal phenomena carry acknowledged uncertainties of three to five days, and different sections use different bright stars as reference, which reads as several observing traditions synthesised rather than one. Dating is disputed, with compilation usually placed near 1000 BCE and Schaefer's heliacal-rising calculation putting it near 1370 BCE and de Jong's estimate falling between 1400 and 1100 BCE.", "sources": [{"citation": "\"MUL.APIN\", Wikipedia. An encyclopedia entry.", "url": "https://en.wikipedia.org/wiki/MUL.APIN", "accessed": "2026-09-21", "supports": "MUL.APIN as a Babylonian astronomical compendium on two tablets; compilation usually placed around 1000 BCE with de Jong's estimate of c. 1400-1100 BCE and Schaefer's separate heliacal calculation of c. 1370 plus or minus 100 BCE for the region of Assur, and the rejection of earlier 2300 BCE proposals; 66 stars and constellations in the three paths of Enlil, Anu and Ea; heliacal rising dates for 34 stars and constellations; intercalation rules us
