ing the Pleiades, Sirius and Arcturus; shadow lengths and water clock specifications; acknowledged uncertainties of 3-5 days; the earliest known copy at 686 BCE", "kind": "tertiary"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "tin-bronze-network", "label": "The tin trade", "change": "Bronze needs tin, tin is nowhere near, so the metal is really a supply chain.", "title": "Bronze turns out to be a problem of supply, not of metallurgy", "type": "discovery", "layer": "knowledge", "date": {"start": -1330, "end": -1310, "precision": "circa"}, "location": {"name": "Uluburun, off the coast of southern Anatolia", "lat": 36.13, "lng": 29.68, "region": "mediterranean"}, "categories": ["technology", "materials", "trade"], "question": "Where does the tin come from, when there is none for a thousand miles?", "answer": "From several places at once, moved through a network of small communities rather than issued by any state.", "significance": "Copper is common and tin is not, so a bronze-using society is by definition one plugged into long-distance exchange, and the alloy is less a metallurgical achievement than a logistical one. Lead, trace element and tin isotope analysis of the tin ingots from a ship that sank around 1320 BCE found a third came from Central Asian ores in present-day Uzbekistan and Tajikistan and two thirds from the Taurus Mountains of Turkey. The authors read this as a multiregional system that depended as much on small regional communities as on the large centralised states usually assumed to have run it.", "sources": [{"citation": "Powell, W., Frachetti, M., Pulak, C., Bankoff, H. A., Barjamovic, G., Johnson, M., Mathur, R., Pigott, V. C., Price, M., & Yener, K. A. (2022). Tin from Uluburun shipwreck shows small-scale commodity exchange fueled continental tin supply across Late Bronze Age Eurasia. Science Advances, 8, eabq3766. DOI 10.1126/sciadv.abq3766.", "url": "https://doi.org/10.1126/sciadv.abq3766", "accessed": "2026-08-24", "supports": "the Uluburun shipwreck off the Turkish coast dated ca. 1320 BCE; lead isotope, trace element and tin isotope sourcing; one third of the tin ingots from Central Asian ores in Uzbekistan and Tajikistan and two thirds from the Taurus Mountains; the conclusion that a culturally diverse, multiregional and multivector system underpinned Eurasian tin exchange, relying as much on small regional communities as on centralised states", "kind": "scholarly"}], "verification": "unverified", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "chicken-domestication", "label": "The chicken", "change": "A bird that came for the rice and stayed, now the commonest on earth.", "title": "Rice farming in Thailand pulls the junglefowl out of the forest", "type": "invention", "layer": "knowledge", "date": {"start": -1250, "end": -1250, "precision": "circa"}, "location": {"name": "Ban Non Wat, central Thailand", "lat": 15.2, "lng": 102.3, "region": "southeast-asia"}, "categories": ["agriculture", "biology"], "question": "What is coming out of the forest to eat the crop, and can it be kept?", "answer": "Red junglefowl, drawn to the grain. The relationship starts with the bird choosing the field, not with anyone catching it.", "significance": "Domestication here runs the other way round from herding: the proposal is that wild junglefowl were drawn in to eat rice seed, nested nearby and were domesticated in place, which makes the crop the cause and the bird the follower. The earliest probable chicken bones at Ban Non Wat in central Thailand are around 3,250 years old — far later than genomic estimates of roughly 8,000 years, and the gap between the two kinds of evidence is the live argument. Current genetic work on Southeast Asian lineages ties domestication to dry-rice farming in central Thailand, which is the same story from the other end.", "sources": [{"citation": "Luu, A. H., Budi, T., Singchat, W., et al. (2026). Ancestral BG1 alleles and structural conservation ensure immune-related genetic resilience in Southeast Asian chicken lineages. Animals, 16, 1398. DOI 10.3390/ani16091398.", "url": "https://doi.org/10.3390/ani16091398", "accessed": "2026-09-21", "supports": "chicken domestication as likely associated with dry-rice farming in central Thailand; genetic diversity in indigenous Southeast Asian chicken lineages", "kind": "scholarly"}, {"citation": "\"Chicken\", Wikipedia. An encyclopedia entry, cited for the archaeological date and the discrepancy with genomic estimates, which the scholarly source above does not give.", "url": "https://en.wikipedia.org/wiki/Chicken", "accessed": "2026-09-21", "supports": "the red junglefowl Gallus gallus as wild ancestor, native to Southeast Asia; genomic studies placing domestication about 8,000 years ago against the earliest probable chicken bones at Ban Non Wat, central Thailand, at some 3,250 years ago; the proposal by Joris Peters and Greger Larson that junglefowl were attracted to rice seed, nested nearby and became domesticated; a 2020 Nature study of 863 chickens concluding a single domestication event", "kind": "tertiary"}], "verification": "contested", "tier": 2, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "reconstructed", "era": "trunk"}, {"id": "oracle-bone-script", "label": "Oracle bones", "change": "The oldest Chinese writing survives as questions put to the dead.", "title": "Chinese writing first survives as divination burned into bone", "type": "invention", "layer": "knowledge", "date": {"start": -1250, "end": -1050, "precision": "range"}, "location": {"name": "Yinxu, Anyang, Henan, northern China", "lat": 36.13, "lng": 114.35, "region": "east-asia"}, "categories": ["writing", "language"], "question": "Will the harvest hold, will the birth go well, should we go to war?", "answer": "Put the question to an ancestor, burn the bone, and read the cracks. Then write down what was asked and what happened.", "significance": "Chinese writing has an unbroken line back to these inscriptions, which makes it the only script in continuous use from the Bronze Age to now. The corpus is large and still mostly unread: over thirty thousand distinct character forms representing roughly four thousand characters, of which between fifteen hundred and two thousand can be deciphered. What survives is an accident of medium, because a record kept on bone outlasts one kept on bamboo, so the earliest Chinese writing we have is the part that happened to be fireproof.", "sources": [{"citation": "Li, B., Yang, J., Liang, Y., Hu, X., Ding, Z., Peng, X., Han, S., Qin, P., Luo, D., Jin, T., Gao, F., Liu, Y., & Ji, R. (2026). OBIMD: A Multi-modal Dataset for Contextual Interpretation of Oracle Bone Inscriptions. Scientific Data, 13, 681. DOI 10.1038/s41597-026-06967-0.", "url": "https://doi.org/10.1038/s41597-026-06967-0", "accessed": "2026-08-24", "supports": "oracle bone inscriptions as the earliest known form of Chinese writing; a corpus of 10,077 inscription images spanning five phases of the Shang Dynasty with 93,652 annotated characters", "kind": "scholarly"}, {"citation": "\"Oracle bone script\", Wikipedia. An encyclopedia entry, cited only for dates and counts alongside the peer-reviewed source above, per D-013.3.", "url": "https://en.wikipedia.org/wiki/Oracle_bone_script", "accessed": "2026-08-24", "supports": "the date range c. 1250-1050 BC covering the last nine Shang kings; Wu Ding's reign radiocarbon dated to 1254-1197 BC; over 30,000 distinct character forms representing around 4,000 characters, of which 1,500-2,000 are deciphered; scapulimancy by heat-cracking and the divination subjects recorded", "kind": "tertiary"}], "verification": "unverified", "tier": 1, "branch": "trunk", "links": {"builds_on": [], "leads_to": []}, "question_status": "attested", "era": "trunk"}]};</script>
<script>
/* The Catch-Up — a timeline you travel down. Carried from the-debrief's site.
 *
 * Director's brief: "I want to feel like I went through the human journey myself."
 * Two things have to be true at once for that:
 *
 *   1. Scrolling has to feel like time passing. So the empty stretches are shown
 *      and labelled — 8,000 years between the first pot and the first farmer is
 *      the single most important fact on this page, and a list hides it.
 *   2. Things happening in different places at the same time have to sit SIDE BY
 *      SIDE, or the reader never sees that people solved the same problems
 *      separately. That is the whole argument of the trunk.
 *
 * Entries within CLUSTER_YEARS of each other form one moment, rendered as a row.
 * Absence is rendered too: regions with nothing yet appear at the point in the
 * story where they would have been (D-014), and every declared era is drawn,
 * merged entries or not, so the timeline reads as mostly empty while it is.
 *
 * Two layers. Knowledge entries are always shown. History entries (political,
 * social, military, demographic, religious) are a second, separately filtered
 * layer the reader turns on and off; the choice is remembered in this browser.
 */
"use strict";

var CLUSTER_YEARS = 400;   // max gap between consecutive entries in one moment
var CLUSTER_SPAN  = 600;   // max total span of a moment
var ZONE_OF = {};   // region -> landmass, filled from era.json
var HISTORY_KEY = "the-catch-up:show-history";
var DATA = null, SHOW_HISTORY = false;
var $ = function (s) { return document.querySelector(s); };

function yr(y) {
  var a = Math.abs(y);
  return a.toLocaleString() + (y < 0 ? " BC" : " AD");
}
function el(t, c, x) {
  var n = document.createElement(t);
  if (c) n.className = c;
  if (x != null) n.textContent = x;
  return n;
}
function place(e) { return e.location.name.split(/[,;(]/)[0].replace(/^The /, "").trim(); }
function zone(e) { return ZONE_OF[e.location.region] || "afro-eurasia"; }
function human(n) {
  // round to the nearest century above a millennium, nearest 50 below. No false
  // precision on a gap that is itself an artefact of which entries exist.
  var r = n >= 1000 ? Math.round(n / 100) * 100 : Math.round(n / 50) * 50;
  return r.toLocaleString() + " years";
}

/* one entry, inside a moment */
function card(e) {
  var c = el("article", "card v-" + e.verification + " z-" + zone(e) + " layer-" + (e.layer || "knowledge"));

  var b = el("button", "card-head");
  b.type = "button";
  b.setAttribute("aria-expanded", "false");
  if (e.layer === "history") b.appendChild(el("span", "card-layer", "History · " + e.type));
  b.appendChild(el("span", "card-region", e.location.region.replace(/-/g, " ")));
  b.appendChild(el("h3", null, e.label || e.title));
  b.appendChild(el("p", "card-change", e.change || ""));
  b.appendChild(el("p", "card-where", place(e)));
  c.appendChild(b);

  var body = el("div", "card-body");
  body.hidden = true;
  body.appendChild(el("p", "card-title", e.title));
  body.appendChild(el("p", "card-sig", e.significance));
  var d = el("details");
  d.appendChild(el("summary", null, "How we know"));
  var meta = el("p", "muted",
    "Dated " + e.date.precision + " · " +
    (e.verification === "verified" ? "reproduced by a second reader"
      : e.verification === "contested" ? "sources disagree"
      : "sourced, not independently double-checked"));
  d.appendChild(meta);
  if (e.question) {
    var q = el("p", "card-q");
    q.appendChild(el("em", null, e.question));
    q.appendChild(el("span", "muted", " — question " + e.question_status));
    d.appendChild(q);
  }
  var ul = el("ul", "src");
  e.sources.forEach(function (s) {
    var li = el("li");
    if (s.url) {
      var a = el("a", null, s.citation);
      a.href = s.url; a.target = "_blank"; a.rel = "noopener";
      li.appendChild(a);
    } else { li.appendChild(document.createTextNode(s.citation)); }
    li.appendChild(el("span", "muted", s.supports));
    ul.appendChild(li);
  });
  d.appendChild(ul);
  body.appendChild(d);
  c.appendChild(body);

  b.addEventListener("click", function () {
    var open = body.hidden;
    body.hidden = !open;
    c.classList.toggle("open", open);
    b.setAttribute("aria-expanded", String(open));
  });
  return c;
}

/* a thread: connective prose that belongs to no single entry, and carries sources */
function threadBlock(t) {
  var w = el("aside", "thread");
  w.appendChild(el("h4", "thread-kicker", "Why"));
  w.appendChild(el("h3", null, t.title));
  (t.body || "").split(/\n\n+/).forEach(function (para) {
    w.appendChild(el("p", null, para));
  });
  if (t.sources && t.sources.length) {
    var d = el("details", "thread-src");
    d.appendChild(el("summary", null, t.sources.length + " sources"));
    var ul = el("ul", "src");
    t.sources.forEach(function (s) {
      var li = el("li");
      if (s.url) {
        var a = el("a", null, s.citation); a.href = s.url; a.target = "_blank"; a.rel = "noopener";
        li.appendChild(a);
      } else { li.appendChild(document.createTextNode(s.citation)); }
      li.appendChild(el("span", "muted", s.supports));
      ul.appendChild(li);
    });
    d.appendChild(ul);
    w.appendChild(d);
  }
  return w;
}

/* the empty stretches, which are the point */
function gapRow(years) {
  var g = el("div", "gapyears");
  g.appendChild(el("span", "gapyears-line"));
  g.appendChild(el("span", "gapyears-label", human(years) + " pass"));
  g.appendChild(el("span", "gapyears-line"));
  // height carries some of the feeling without making 8,000 years unscrollable
  var h = Math.min(26, Math.max(4, Math.log10(Math.max(years, 10)) * 7));
  g.style.setProperty("--gap-h", h + "vh");
  return g;
}

function momentRow(m) {
  var row = el("section", "moment");
  row.dataset.when = m.entries.length === 1
    ? yr(m.entries[0].date.start)
    : yr(m.lo) + "–" + yr(m.hi);

  var when = el("div", "moment-when");
  when.appendChild(el("span", "dot"));
  when.appendChild(el("span", "moment-year", row.dataset.when));
  // Count PLACES, not entries. Four Babylonian tablets are not "four places at
  // once", and saying so would fake exactly the parallelism this view exists to show.
  var places = {};
  m.entries.forEach(function (e) { places[e.location.region] = 1; });
  var n = Object.keys(places).length;
  if (n > 1) {
    when.appendChild(el("span", "moment-note", n + " places at once"));
  } else if (m.entries.length > 1) {
    when.appendChild(el("span", "moment-note muted-note",
      m.entries.length + " in one place"));
  }
  row.appendChild(when);

  // Facet by world area rather than tinting 16 regions: the validator fails any
  // categorical palette past three hues here, so grouping carries region and
  // colour carries only the three landmasses that were out of contact.
  var lane = el("div", "moment-lane");
  var groups = {}, order = [];
  m.entries.forEach(function (e) {
    var k = e.location.region;
    if (!groups[k]) { groups[k] = []; order.push(k); }
    groups[k].push(e);
  });
  order.forEach(function (k) {
    var g = el("div", "area z-" + zone(groups[k][0]));
    g.appendChild(el("h4", "area-name", k.replace(/-/g, " ")));
    var cards = el("div", "area-cards");
    groups[k].forEach(function (e) { cards.appendChild(card(e)); });
    g.appendChild(cards);
    lane.appendChild(g);
  });
  row.appendChild(lane);
  return row;
}

function absenceRow(empty) {
  var a = el("section", "absent");
  a.appendChild(el("h4", null, "Nothing here yet"));
  a.appendChild(el("p", null,
    "People were working on the same problems in these places across this whole " +
    "stretch. This account has nothing on them — a gap in the telling, not in the past."));
  var ul = el("ul", "absent-list");
  empty.forEach(function (d) { ul.appendChild(el("li", null, d.region.replace(/-/g, " "))); });
  a.appendChild(ul);
  return a;
}

function cluster(entries) {
  // Gap alone is not enough: with a dense corpus each entry extends the previous
  // cluster and the whole Bronze Age chains into one "moment". A moment also has
  // a maximum total span.
  var out = [], cur = null;
  entries.forEach(function (e) {
    if (cur && e.date.start - cur.hi <= CLUSTER_YEARS
            && e.date.start - cur.lo <= CLUSTER_SPAN) {
      cur.entries.push(e);
      cur.hi = Math.max(cur.hi, e.date.start);
    } else {
      cur = { lo: e.date.start, hi: e.date.start, entries: [e] };
      out.push(cur);
    }
  });
  return out;
}

function chapter(key, meta, entries) {
  var sec = el("section", "chapter");
  sec.dataset.era = meta.title || meta.label || key;

  var h = el("header", "chapter-head");
  if (meta.span) h.appendChild(el("p", "chapter-span", yr(meta.span.start) + " — " + yr(meta.span.end)));
  h.appendChild(el("h2", null, meta.title || meta.label || key));
  if (meta.strap) h.appendChild(el("p", "chapter-strap", meta.strap));
  if (meta.intro) h.appendChild(el("p", "chapter-intro", meta.intro));
  sec.appendChild(h);

  if (!entries.length) {
    // A declared era with nothing merged. Drawn on purpose: an era left off the
    // page reads as an era that does not exist, not as one nobody has written.
    var none = el("section", "absent era-empty");
    none.appendChild(el("h4", null, "Nothing here yet"));
    none.appendChild(el("p", null,
      "This stretch of the timeline is declared and not yet written. Its target is " +
      (meta.floor_total || 0) + " knowledge entries across " + ((meta.debt || []).length) +
      " regions" + (meta.history_floor_total ? ", and " + meta.history_floor_total + " history entries" : "") +
      ". A gap in the telling, not in the past."));
    sec.appendChild(none);
    return sec;
  }

  var moments = cluster(entries.slice().sort(function (a, b) {
    return a.date.start - b.date.start || a.date.end - b.date.end;
  }));

  var empty = (meta.debt || []).filter(function (d) { return d.have === 0; });
  var absentAt = Math.min(2, moments.length - 1);

  var periods = (meta.periods || []).slice();
  var threads = (meta.threads || []).slice().sort(function (a, b) { return a.at - b.at; });
  var shown = {}, threadAt = 0;
  moments.forEach(function (m, i) {
    // drop a thread in when the timeline reaches the moment it explains
    while (threadAt < threads.length && threads[threadAt].at <= m.hi) {
      sec.appendChild(threadBlock(threads[threadAt])); threadAt++;
    }
    var p = periods.filter(function (x) { return m.lo >= x.start && m.lo <= x.end; })[0];
    if (p && !shown[p.id]) {
      shown[p.id] = 1;
      var band = el("div", "period");
      band.appendChild(el("h3", null, p.name));
      band.appendChild(el("p", "period-when",
        yr(p.start) + " – " + yr(p.end)));
      // The conventional name is shown WITH its scope. Naming a global band after
      // Old World metallurgy tells a reader Caral had bronze; it did not.
      if (p.also) {
        var a = el("p", "period-also");
        a.appendChild(el("b", null, "Also called " + p.also));
        if (p.also_scope) a.appendChild(el("span", null, " \u2014 " + p.also_scope));
        band.appendChild(a);
      }
      if (p.note) band.appendChild(el("p", "period-note", p.note));
      sec.appendChild(band);
    }
    if (i > 0) {
      var years = m.lo - moments[i - 1].hi;
      if (years >= 200) sec.appendChild(gapRow(years));
    }
    sec.appendChild(momentRow(m));
    if (i === absentAt && empty.length) sec.appendChild(absenceRow(empty));
  });

  if (meta.closing) {
    var c = el("div", "chapter-close");
    c.appendChild(el("p", null, meta.closing));
    sec.appendChild(c);
  }
  return sec;
}

function readToggle() {
  try { return window.localStorage.getItem(HISTORY_KEY) === "on"; } catch (e) { return false; }
}
function writeToggle(on) {
  try { window.localStorage.setItem(HISTORY_KEY, on ? "on" : "off"); } catch (e) { /* not kept: fine */ }
}

/* which entries the page shows: knowledge always, history only when switched on */
function visible(all) {
  return all.filter(function (e) { return (e.layer || "knowledge") !== "history" || SHOW_HISTORY; });
}

function banner(data) {
  // The confidence state travels with the page, merged or not. If this ever
  // reaches a reader who is not the Director, this line is what stands between
  // them and claims nobody has independently reproduced (charter, never ship
  // `unverified` as verified).
  var all = data.entries || [];
  var v = all.reduce(function (a, e) { a[e.verification] = (a[e.verification] || 0) + 1; return a; }, {});
  var w = el("div", "warn");
  w.appendChild(el("b", null, data.preview ? "PREVIEW — not merged." : "DRAFT — not checked."));
  w.appendChild(el("span", null,
    " " + all.length + " entries, " + (v.verified || 0) +
    " independently verified. Sourced but not double-checked: " + (v.unverified || 0) +
    ". Sources disagree: " + (v.contested || 0) + "." +
    (data.preview ? " Built from " + data.generated_from + "." : "")));
  return w;
}

function toggle(data) {
  var n = (data.entries || []).filter(function (e) { return e.layer === "history"; }).length;
  var wrap = el("p", "layer-toggle");
  var b = el("button", "layer-btn");
  b.type = "button";
  b.id = "history-toggle";
  b.setAttribute("aria-pressed", String(SHOW_HISTORY));
  b.textContent = (SHOW_HISTORY ? "Hide" : "Show") + " the history layer";
  b.addEventListener("click", function () {
    SHOW_HISTORY = !SHOW_HISTORY;
    writeToggle(SHOW_HISTORY);
    render();
    var again = $("#history-toggle");
    if (again) again.focus();
  });
  wrap.appendChild(b);
  wrap.appendChild(el("span", "layer-note",
    n + " history entr" + (n === 1 ? "y" : "ies") + ": political, social, military, demographic and " +
    "religious events, filtered separately from the knowledge. " +
    (SHOW_HISTORY ? "Shown, marked History." : "Hidden.")));
  return wrap;
}

function render() {
  var data = DATA;
  var doc = $("#doc");
  doc.textContent = "";
  var old = document.querySelector(".warn");
  if (old) old.parentNode.removeChild(old);
  document.body.insertBefore(banner(data), document.body.firstChild);

  var open = el("header", "open");
  open.appendChild(el("h1", null, "The Catch-Up"));
  open.appendChild(el("p", "open-lede",
    "What humanity worked out, in the order it worked it out. Scroll down and time passes; " +
    "things side by side happened at the same time, in different places, usually without " +
    "anyone knowing about the others."));
  open.appendChild(toggle(data));
  var key = el("p", "zonekey");
  [["afro-eurasia", "Afro-Eurasia"], ["americas", "The Americas"], ["oceania", "Oceania"]]
    .forEach(function (p) {
      var t = el("span", "zonetag z-" + p[0]);
      t.appendChild(el("span", "swatch"));
      t.appendChild(el("span", null, p[1]));
      key.appendChild(t);
    });
  key.appendChild(el("span", "zonekey-note",
    "Three landmasses out of contact with each other for the trunk's whole stretch."));
  open.appendChild(key);
  doc.appendChild(open);

  var all = visible(data.entries || []);
  var byEra = {};
  all.forEach(function (e) { (byEra[e.era] = byEra[e.era] || []).push(e); });
  var order = Object.keys(data.eras || {}).sort(function (a, b) {
    return ((data.eras[a].order || 99) - (data.eras[b].order || 99)) ||
           (((data.eras[a].span || {}).start || 0) - ((data.eras[b].span || {}).start || 0));
  });
  Object.keys(byEra).forEach(function (k) { if (order.indexOf(k) < 0) order.push(k); });
  order.forEach(function (k) {
    doc.appendChild(chapter(k, data.eras[k] || {}, byEra[k] || []));
  });

  var short = 0, regions = 0, written = 0;
  order.forEach(function (k) {
    var m = data.eras[k] || {};
    short += m.debt_total || 0;
    regions += (m.debt || []).length;
    if (byEra[k] && byEra[k].length) written++;
  });
  var end = el("footer", "end");
  end.appendChild(el("p", "end-lede", "That is as far as the account goes."));
  end.appendChild(el("p", null,
    "It holds " + (data.entries || []).length + " entries in " + written + " of " + order.length +
    " declared eras, and is " + short + " knowledge entries short of its own target across " +
    regions + " era-and-region cells. Not finished."));
  doc.appendChild(end);
  track();
}

var rail, railEra, railWhen;
function track() {
  if (!rail) return;
  var top = function (n) { return n.getBoundingClientRect().top + window.scrollY; };
  var y = window.scrollY + window.innerHeight * 0.4;
  var ch = null, mo = null;
  [].forEach.call(document.querySelectorAll(".chapter"), function (c) { if (top(c) <= y) ch = c; });
  [].forEach.call(document.querySelectorAll(".moment"), function (m) { if (top(m) <= y) mo = m; });
  if (!ch || window.scrollY < 140) { rail.hidden = true; return; }
  rail.hidden = false;
  railEra.textContent = ch.dataset.era;
  railWhen.textContent = mo ? mo.dataset.when : "";
}

function boot(data) {
  DATA = data;
  Object.keys(data.eras || {}).forEach(function (k) {
    var z = (data.eras[k] || {}).zones || {};
    Object.keys(z).forEach(function (name) {
      z[name].forEach(function (r) { ZONE_OF[r] = name; });
    });
  });
  SHOW_HISTORY = readToggle();
  rail = $("#rail"); railEra = $("#rail-era"); railWhen = $("#rail-when");
  window.addEventListener("scroll", track, { passive: true });
  render();
}

Promise.resolve(window.__CORPUS__)
  .then(function (d) {
    if (d) return d;
    return fetch("corpus.json").then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  })
  .then(boot)
  .catch(function (err) {
    $("#doc").textContent = "No corpus — run: python3 tools/index.py  (" + err + ")";
  });

</script>
</body>
</html>
